# The index rows of the ADRs before 0083, copied verbatim from the old README table when ADR 0083 landed.
# This file never changes again (ADR 0083). An ADR here that is still Proposed is accepted by giving its own
# file front matter; a later ADR supersedes one here in its own front matter. The docs test and the docs site
# (layouts/_shortcodes/adr-index.html) both read it.
- {adr: "0001", file: "0001-phase-0-defaults.md", decision: "Defaults taken to start Phase 0; append-only decisions log", status: "Proposed (awaiting Alex); log entries accepted as dated"}
- {adr: "0002", file: "0002-engineering-rules.md", decision: "Engineering rules from the reading list (decision 35)", status: "Accepted 2026-10-04; D7 partly superseded by 0078 for the profile page"}
- {adr: "0003", file: "0003-chat-lookup-private-members.md", decision: "Chat does not reveal private members by handle (decision 36)", status: "Accepted 2026-10-04"}
- {adr: "0004", file: "0004-no-false-sense-of-privacy.md", decision: "No false sense of privacy: show what the network can see (decision 37)", status: "Accepted 2026-10-04; partly superseded by 0078 for the profile page"}
- {adr: "0005", file: "0005-atproto-spaces-destination.md", decision: "Atproto Spaces is the destination for private data (decision 38)", status: "Accepted 2026-10-04"}
- {adr: "0006", file: "0006-private-likes-shown-to-target.md", decision: "Private likes, comments and follows are shown to their target (decision 39)", status: "Accepted 2026-10-04"}
- {adr: "0007", file: "0007-bootstrap-reconciliation.md", decision: "Bootstrap reconciliation: which Phase 0 step changes each bootstrap file", status: "Proposed (awaiting Alex)"}
- {adr: "0008", file: "0008-ruleset-without-required-approvals.md", decision: "Main-branch ruleset without required approvals (decision 40)", status: "Accepted 2026-10-04; merge clause and SE-6 review clause superseded by 0019"}
- {adr: "0009", file: "0009-no-branch-protection-on-free-private-repo.md", decision: "No branch protection while the repository is private on the free plan (decision 41)", status: "Superseded by 0017"}
- {adr: "0010", file: "0010-opaque-chat-ids.md", decision: "Opaque chat ids close the key-query membership leak (decision 42)", status: "Accepted 2026-10-04"}
- {adr: "0011", file: "0011-no-orchestrator-until-measured-need.md", decision: "No orchestrator until a measured need beyond one host (rule AB-3)", status: "Accepted 2026-10-04"}
- {adr: "0012", file: "0012-licence.md", decision: "AGPL-3.0-only for the product, MIT for `shared/` (decision 27)", status: "Accepted 2026-10-03"}
- {adr: "0013", file: "0013-identity-network-port.md", decision: "Identity resolution behind a network port, DNS on c-ares", status: "Proposed (awaiting Alex)"}
- {adr: "0014", file: "0014-node-postgres.md", decision: "node-postgres as the Postgres driver", status: "Proposed (awaiting Alex)"}
- {adr: "0015", file: "0015-web-framework-glue.md", decision: "Web framework glue: Hono with server-rendered React and islands (P1.20 spike)", status: "Superseded by 0054"}
- {adr: "0016", file: "0016-design-source.md", decision: "The unset.sh design sheet is the design source (P1.21)", status: "Superseded by 0055"}
- {adr: "0017", file: "0017-main-ruleset-applied.md", decision: "Main ruleset applied; supersedes 0009", status: "Accepted 2026-10-06; merge sentence superseded by 0019"}
- {adr: "0018", file: "0018-edge-rate-limit-plugin.md", decision: "Edge rate limiting with caddy-ratelimit, in memory only (P1.28)", status: "Accepted 2026-10-07 (P1.28, #409)"}
- {adr: "0019", file: "0019-verified-agent-merges.md", decision: "Verified agent merges: a verifier session merges checked agent PRs (P0.15)", status: "Accepted on merge (2026-10-12)"}
- {adr: "0020", file: "0020-permanent-choices.md", decision: "Permanent choices: Matrix server name, Tailnet Lock custody, permission set NSID (P1.32)", status: "Superseded by 0025"}
- {adr: "0021", file: "0021-atproto-oauth-client.md", decision: "@atproto/oauth-client-node as the OAuth client (P2.04)", status: "Proposed (awaiting Alex)"}
- {adr: "0022", file: "0022-web-egress-and-shared-plc.md", decision: "web gets its own egress network; we use the shared PLC (P2.05e)", status: "Proposed (awaiting Alex)"}
- {adr: "0023", file: "0023-local-pds-publishes-to-shared-plc.md", decision: "The local PDS publishes to the shared PLC, with a few fixed test accounts (P1.34t)", status: "Proposed (awaiting Alex)"}
- {adr: "0024", file: "0024-atproto-api-agent.md", decision: "@atproto/api Agent as the XRPC client over an OAuth session (P2.07)", status: "Proposed (awaiting Alex)"}
- {adr: "0025", file: "0025-public-domains.md", decision: "Public domains: app `unset.sh`, PDS `unset.ac`, handles `unset.im`, chat `unset.cc`; development `staging.unset.*`", status: "Accepted by Alex 2026-10-19"}
- {adr: "0026", file: "0026-local-email-gate-exception.md", decision: "Local-only email-gate exception for `alice.unset.im` and `bob.unset.im` (mechanism 2)", status: "Proposed (awaiting Alex)"}
- {adr: "0027", file: "0027-pds-frontend-distribution.md", decision: "PDS frontend distribution replacement with unchanged backend and runtime configuration (P2.24a)", status: "Accepted by Alex 2026-10-18; implementation pending"}
- {adr: "0029", file: "0029-media-domain.md", decision: "Media domain `unset.site`; development `staging.unset.site`", status: "Proposed (awaiting Alex)"}
- {adr: "0030", file: "0030-pangolin-checks-at-our-edge.md", decision: "Staging behind Pangolin: method scope and last-hop trust move to our edge, cookie and logging clauses of 0025 restated", status: "Accepted by Alex 2026-10-19"}
- {adr: "0031", file: "0031-public-staging-pds.md", decision: "Staging public through Pangolin, no login, no certificate at our edge; departs from 0025 and 0030 for dev only", status: "Accepted 2026-10-20; Decision 2 and Decision 1's plain-http sentence superseded by 0032"}
- {adr: "0032", file: "0032-self-signed-dev-edge.md", decision: "Self-signed certificate at the dev edge behind Pangolin; supersedes 0031 Decision 2 for dev only", status: "Accepted 2026-10-20"}
- {adr: "0033", file: "0033-image-signing-keyless.md", decision: "Image signing: keyless cosign with our exact workflow identity (P1.27s)", status: "Accepted 2026-10-20"}
- {adr: "0034", file: "0034-docs-only-auto-merge.md", decision: "Docs-only pull requests auto-merge when CI is green (P0.07e)", status: "Proposed (awaiting Alex)"}
- {adr: "0035", file: "0035-web-search-searxng.md", decision: "Web search through our own SearXNG, queried by the server through net-guard (P3.14s)", status: "Proposed (awaiting Alex)"}
- {adr: "0036", file: "0036-staging-builds-from-source.md", decision: "Staging builds its images from the checkout under `--env dev --source`; production stays signed and pinned (P1.37y)", status: "Accepted 2026-10-28"}
- {adr: "0037", file: "0037-profile-module-and-page.md", decision: "The profile is its own module, stored on the member's PDS, edited by its owner (P2.20)", status: "Accepted 2026-10-28; Decision 2's strict-validator clause superseded by 0038; decisions 4, 5, 8 and the README half of 7 superseded by 0051"}
- {adr: "0038", file: "0038-profile-save-keeps-unknown-fields.md", decision: "A profile save keeps stored fields the lexicon does not define (P2.20f)", status: "Accepted 2026-10-29"}
- {adr: "0039", file: "0039-request-scopes-per-feature.md", decision: "Sign-in asks only for the scopes a shipped feature uses (P1.31s)", status: "Accepted 2026-11-16"}
- {adr: "0040", file: "0040-index-repos-holding-a-profile.md", decision: "Index any repo that holds our profile record, with caps and non-member privacy (P3.08d)", status: "Accepted 2026-11-16"}
- {adr: "0041", file: "0041-object-store.md", decision: "One S3-compatible object store (SeaweedFS in our stacks) for app media and PDS blobs (P2.18s, P2.18p)", status: "Accepted 2026-11-15"}
- {adr: "0042", file: "0042-app-limits-behind-the-edge.md", decision: "Behind the edge, the app's rate limits are site-wide ceilings; the edge is the only per-client limiter (P1.06s)", status: "Accepted 2026-11-15"}
- {adr: "0043", file: "0043-audit-actor-column.md", decision: "The audit side row names its actor in a DID column, so erasure finds a person's rows as actor as well as subject (P1.15k)", status: "Accepted 2026-11-15"}
- {adr: "0044", file: "0044-trusted-paths-labelled-not-isolated.md", decision: "A trusted-path change carries the `security-review` label and is reviewed at its exact head; the trusted-base split and its guards are retired; five template headings (P0.09c)", status: "Accepted 2026-11-15"}
- {adr: "0045", file: "0045-kit-enforces-the-session-gate.md", decision: "The request kit enforces the session gate on routes that require one (P1.04g)", status: "Accepted 2026-11-15"}
- {adr: "0046", file: "0046-edge-checks-read-caddy-adapt.md", decision: "The edge's checks read Caddy's own adapted config, not our reading of the Caddyfile (P1.39a to P1.39e)", status: "Accepted"}
- {adr: "0047", file: "0047-lock-bump-auto-merge.md", decision: "A lock bump the publish run opened merges itself once the `lock` check is required and green (P2.26n)", status: "Accepted 2026-11-16"}
- {adr: "0050", file: "0050-object-store-admin-through-its-shell.md", decision: "The object store's buckets and clean-up run through its own shell; no S3 admin key; supersedes two clauses of 0041 (P2.18s)", status: "Accepted 2026-11-16"}
- {adr: "0048", file: "0048-session-issuer-origin.md", decision: "The session row records the sign-in server's origin, so account pages stop unsealing the token set for a link (P2.03n)", status: "Accepted 2026-11-15"}
- {adr: "0049", file: "0049-sessions-end-with-their-token-set.md", decision: "A browser session ends with its token set, enforced by a foreign key with ON DELETE CASCADE (P2.03t)", status: "Accepted 2026-11-16"}
- {adr: "0051", file: "0051-profile-cards-lexicon.md", decision: "The profile is a minimal record plus one card record per card; supersedes parts of 0037 (P2.20m)", status: "Accepted 2026-11-17"}
- {adr: "0052", file: "0052-ingest-our-pds-with-atproto-sync.md", decision: "Ingest our own PDS with `@atproto/sync`, not Tap, for the first indexer slice (P3.05s)", status: "Accepted 2026-11-17; decision 3's queue clause superseded by 0053, decision 1's `Firehose` phrase by 0058"}
- {adr: "0053", file: "0053-queue-members-for-the-index-at-onboarding-end.md", decision: "Queue members for the index when their onboarding ends, in `idx`; supersedes one clause of 0052 (P3.02s)", status: "Accepted 2026-11-17"}
- {adr: "0054", file: "0054-web-process-on-sveltekit.md", decision: "The web process runs on SvelteKit with Svelte 5 screens; Hono is removed; supersedes 0015 (P1.20a)", status: "Accepted 2026-11-18"}
- {adr: "0055", file: "0055-shadcn-svelte-and-one-theme-file.md", decision: "shadcn-svelte components, themed by one file in the repo; supersedes 0016 (P1.20a)", status: "Accepted 2026-11-18"}
- {adr: "0056", file: "0056-web-boundary-by-file-kind.md", decision: "In the web process the UI/server boundary is by file kind, checked; the request gate is server.ts plus the hook (P1.20a)", status: "Accepted 2026-11-18"}
- {adr: "0057", file: "0057-small-and-auditable-means-the-code.md", decision: "\"Small and auditable\" means our own code; a package meeting a written bar needs no ADR unless it touches auth, crypto, egress or personal data; amends DO-1 (P0.09)", status: "Accepted 2026-11-17"}
- {adr: "0058", file: "0058-read-the-stream-without-the-firehose-class.md", decision: "Read our PDS's stream with `@atproto/sync`'s parsers, not its `Firehose` class; supersedes one phrase of 0052 (P3.05s)", status: "Accepted 2026-11-17"}
- {adr: "0059", file: "0059-narrow-typed-lines-and-group-updates.md", decision: "Alex's typed line only for security loosenings and ADRs; grouped Renovate updates; drafts run the cheap checks; merges tested on main's tip; amends 0019 (P0.07l)", status: "Accepted 2026-11-18"}
- {adr: "0060", file: "0060-pds-admin-issues-member-invites.md", decision: "`pds-admin`, the one holder of the PDS admin password, issues member invites (P2.09)", status: "Proposed (awaiting Alex)"}
- {adr: "0062", file: "0062-member-search-and-ai-choices.md", decision: "Members choose whether search engines and AI search may show their public page; AI training is blocked site-wide (P3.12s)", status: "Proposed (awaiting Alex)"}
- {adr: "0063", file: "0063-handle-records-written-on-claim.md", decision: "Each member's handle record is written to DNS when they claim it, in zones at deSEC (unset.name and staging.unset.name); supersedes 0025's hand-added staging records (P3.08s)", status: "Proposed (awaiting Alex)"}
- {adr: "0064", file: "0064-handles-move-to-unset-name.md", decision: "Handles move from unset.im to unset.name, a DNSSEC-signed domain; supersedes 0025's handle rows", status: "Proposed (awaiting Alex)"}
- {adr: "0065", file: "0065-resend-sends-account-mail-from-the-us.md", decision: "Resend sends account mail for now, with its data in the United States; drops answer 21's Canada or EU hosting (P2.25)", status: "Proposed (awaiting Alex)"}
- {adr: "0066", file: "0066-edge-app-burst-sixty.md", decision: "The edge's `app_burst` zone allows 60 requests per 10 seconds per address; supersedes 0031's value 20 and two sizing statements of 0042 (P1.20r)", status: "Accepted 2026-11-20"}
- {adr: "0067", file: "0067-account-lifecycle-and-burned-names.md", decision: "Deactivation, deletion after 30 days, takedown and moving away follow atproto's account model; no PLC tombstone by default; every hosted name is burned (P1.21e)", status: "Accepted 2026-11-20"}
- {adr: "0068", file: "0068-profile-card-surfaces.md", decision: "Each profile card chooses Filled, Outlined or Plain through an optional surface field", status: "Accepted 2026-11-20"}
- {adr: "0069", file: "0069-split-client-and-build-file-zone.md", decision: "The web client is split into content-hashed pieces, and the dev app edge counts them in their own zone, `app_files`; supersedes \"no matcher\" for `app_burst` in 0031 and 0066 (P1.21g)", status: "Accepted 2026-11-20"}
- {adr: "0070", file: "0070-shared-image-foundation.md", decision: "One shared image foundation: images are blobs in the member's repository, each use carries its alt text; intake, processing in its own no-network process, an empty inspection port, storage and publish; uploads with nothing mounted only on a closed list of test origins (P2.17)", status: "Accepted 2026-11-20"}
- {adr: "0071", file: "0071-limits-for-thousands-of-members.md", decision: "Limits sized for thousands of members; web marks its own PDS calls with a key so the edge gives them their own zones; app_signin counts only the login and join posts (P1.21j)", status: "Accepted 2026-11-20"}
- {adr: "0072", file: "0072-profile-page-layout.md", decision: "The profile chooses its page layout, sidebar or compact, through an optional layout field (P1.21n)", status: "Superseded by 0077"}
- {adr: "0073", file: "0073-text-card-rich-editor.md", decision: "The Text card is written in a Milkdown editor over the plain field, loaded on open; the CSP adds the one Trusted Types name `ProseMirrorClipboard` (P1.21u)", status: "Accepted 2026-11-20"}
- {adr: "0074", file: "0074-one-save-for-cards-edited-in-place.md", decision: "Text cards are edited in place on the owner's page and saved together by one Save, all or none, through applyWrites on the repo head; drafts stay on the device (P1.21v)", status: "Proposed (awaiting Alex)"}
- {adr: "0075", file: "0075-docs-site-on-the-staging-edge.md", decision: "The docs site at docs.unset.sh is a third site on the staging edge, served as files from the checkout with its own CSP and zone (P1.21w)", status: "Accepted 2026-11-20"}
- {adr: "0076", file: "0076-image-uploads-up-to-64-mib.md", decision: "Image uploads up to 64 MiB and 110 megapixels; web, net-guard and review caps, memory and the edge's read window rise with it (P2.19e)", status: "Accepted 2026-11-20"}
- {adr: "0077", file: "0077-one-profile-layout.md", decision: "The profile page has one layout, the header above the cards; the unpublished layout field is removed (P1.21x); supersedes 0072", status: "Accepted 2026-11-21"}
- {adr: "0078", file: "0078-who-sees-the-profile-page.md", decision: "The member chooses who sees their page: Public, Signed-in members only or Only me; others get a limited page; partly supersedes 0004 and D7 for the profile page (P1.22a)", status: "Accepted 2026-11-21"}
- {adr: "0079", file: "0079-notifications-in-core.md", decision: "Notifications are a core inbox: one send call, one reason table, gone once opened and at 30 days, a sign-in entry only older browsers can clear, and the contract a module will get (P2.27)", status: "Accepted 2026-11-21; point 3 amended by 0081"}
- {adr: "0080", file: "0080-invite-requests-mail-the-owner.md", decision: "Invite requests: web mails the owner each visitor's address over SMTP, keeps no copy, limits by address and site-wide (P2.10r)", status: "Accepted 2026-11-21"}
- {adr: "0081", file: "0081-notifications-stay-until-dismissed.md", decision: "Notifications stay until dismissed: looking changes nothing; dismiss one, the selected or all; the full-window page with a list beside the detail (P2.27b); amends 0079 point 3", status: "Proposed (awaiting Alex)"}
- {adr: "0082", file: "0082-sign-in-history.md", decision: "Sign-in history: the time of each sign-in only, kept 30 days, any entry deletable by the member, a second check later (P2.27c, P2.28)", status: "Accepted 2026-11-21"}
