# Prose for the http endpoint page. Keys are "METHOD path".
# Security columns are read from the manifest and limits.ts, not from this file.
# auth is the handler: "gate: openApp", "reads session", or "none". Not the manifest session.
"GET /health":
  why: "Readiness for container probes. The kit adds this route (shared/http/health.ts)."
  input: "No request body."
  output: "JSON with status, service and commit. 200 when ready."
  errors: "503 when status is starting, unready or draining (shared/http/health.ts)."
  auth: "none"
"GET /":
  why: "Landing page in the app shell, group public (interfaces/http/routes/home.ts)."
  input: "No request body."
  output: "HTML page titled unset.sh."
  errors: "The handler names no error code of its own."
  auth: "none"
"GET /legal/terms":
  why: "Terms of service, group public, no client script (interfaces/http/routes/legal.ts)."
  input: "No request body. A lang query is ignored."
  output: "HTML terms page, kept out of search results."
  errors: "The handler names no error code of its own."
  auth: "none"
"GET /legal/privacy":
  why: "Privacy notice, group public, no client script (interfaces/http/routes/legal.ts)."
  input: "No request body. A lang query is ignored."
  output: "HTML privacy page, kept out of search results."
  errors: "The handler names no error code of its own."
  auth: "none"
"GET /legal/domains":
  why: "Our domains, group public, no client script (interfaces/http/routes/legal.ts)."
  input: "No request body. A lang query is ignored."
  output: "HTML domains page, kept out of search results."
  errors: "The handler names no error code of its own."
  auth: "none"
"GET /.well-known/security.txt":
  why: "security.txt built once at boot (interfaces/http/routes/security-txt.ts)."
  input: "No request body."
  output: "text/plain document, cache-control no-cache."
  errors: "The handler names no error code of its own."
  auth: "none"
"POST /prefs/theme":
  why: "Sets the theme cookie from a form and redirects (interfaces/http/routes/prefs.ts)."
  input: "Form fields theme and return."
  output: "303 to the checked return path, with a theme cookie."
  errors: "prefs.invalid when theme is missing, repeated or unrecognised."
  auth: "none"
"GET /assets/:file":
  why: "Serves a built web file looked up by exact name (interfaces/http/routes/assets.ts)."
  input: "Path parameter file."
  output: "File bytes for js, css, woff2, svg or png."
  errors: "http.not_found when the name is not in the startup map or the extension is not served."
  auth: "none"
"GET /oauth-client-metadata.json":
  why: "OAuth client metadata, built once at boot (interfaces/http/routes/oauth-metadata.ts)."
  input: "No request body."
  output: "JSON metadata, cacheable for 5 minutes."
  errors: "The handler names no error code of its own."
  auth: "none"
"GET /oauth/jwks.json":
  why: "Public client keys, including a key still in rotation (interfaces/http/routes/oauth-metadata.ts)."
  input: "No request body."
  output: "JSON Web Key Set, cacheable for 5 minutes."
  errors: "The handler names no error code of its own."
  auth: "none"
"GET /login":
  why: "Shows the sign-in form (interfaces/http/routes/login.ts)."
  input: "Optional query handle, next and error."
  output: "HTML sign-in page, or 303 to /did when a session is present and error is absent."
  errors: "The page can show a checked error query. The handler names no new error code."
  auth: "reads session"
"POST /login":
  why: "Chooses the account and starts authorization. It does not create a session (interfaces/http/routes/login.ts)."
  input: "Form fields handle, intent and next."
  output: "303 to /login/continue with nonce and target cookies, or 303 back to /login."
  errors: "login.handle_invalid, login.handle_not_found, login.identity_unavailable, login.failed, or login followed by the authorize reason."
  auth: "none"
"GET /login/continue":
  why: "Sends the browser to the authorization URL stored by POST /login (interfaces/http/routes/login.ts)."
  input: "No request body. The target is taken from the continuation cookie."
  output: "HTML continue page, or 303 back to /login."
  errors: "login.expired when the stored target is missing or not an allowed link."
  auth: "none"
"GET /oauth/callback":
  why: "Turns a grant into a session for the browser that started sign-in (interfaces/http/routes/oauth-callback.ts). A mutating GET listed in GET_MUTATION_EXCEPTIONS."
  input: "OAuth callback query. The nonce cookie is compared with the returned app state."
  output: "303 to the stored next path or /did, with a session cookie, or 303 back to /login."
  errors: "login.failed, login.state_mismatch, login.expired, login.account_mismatch, login.scope_insufficient, or login followed by the callback reason."
  auth: "none"
"POST /logout":
  why: "Ends this browser's session (interfaces/http/routes/logout.ts)."
  input: "Form body. The handler reads the session cookie, not form fields."
  output: "303 to /signed-out. A live session is destroyed. The last session also revokes the grant."
  errors: "logout.failed when destroySession throws."
  auth: "reads session"
"GET /signed-out":
  why: "Page after sign-out (interfaces/http/routes/logout.ts)."
  input: "No request body. An issuer cookie may be present."
  output: "HTML signed-out page, or 303 to /did when a session is present."
  errors: "The handler names no error code of its own."
  auth: "reads session"
"GET /verify-email":
  why: "Shows whether the PDS reports the email confirmed (interfaces/http/routes/verify-email.ts)."
  input: "No request body. A query string is ignored."
  output: "HTML confirm-email page in one of confirmed, unconfirmed, needs_consent or unavailable, or a redirect."
  errors: "login.session_ended when the PDS says the grant is dead. Other PDS failures render the unavailable state."
  auth: "reads session"
"POST /verify-email/reconsent":
  why: "Starts a new authorization with prompt consent for the same account (interfaces/http/routes/verify-email.ts)."
  input: "Form body. The account is the session, not a form field."
  output: "303 to /login/continue with nonce and target cookies, or a redirect back."
  errors: "login.failed when the authorization URL is not an allowed link, or login followed by the authorize reason."
  auth: "reads session"
"GET /did":
  why: "Sends the signed-in member to their own account path (interfaces/http/routes/me.ts)."
  input: "No request body."
  output: "303 to / followed by the session DID, or the gate's redirect."
  errors: "The handler returns the gate's redirect. It names no error code of its own."
  auth: "gate: openApp"
"GET /me":
  why: "Legacy path to the signed-in member's account (interfaces/http/routes/me.ts)."
  input: "No request body."
  output: "303 to / followed by the session DID, or the gate's redirect."
  errors: "The handler returns the gate's redirect. It names no error code of its own."
  auth: "gate: openApp"
"GET /:did":
  why: "The signed-in member's own account page (interfaces/http/routes/me.ts)."
  input: "Path parameter did."
  output: "HTML account page, a gate redirect, or 404."
  errors: "http.not_found when the path is not a DID or is not the session's DID."
  auth: "gate: openApp"
"GET /welcome":
  why: "Sends onboarding on to the current step (interfaces/http/routes/welcome.ts)."
  input: "No request body."
  output: "303 to the step for this account, or to /login."
  errors: "The handler names no error code of its own."
  auth: "reads session"
"GET /welcome/age":
  why: "Asks for a birth date. The date is not stored (interfaces/http/routes/welcome.ts)."
  input: "No request body."
  output: "HTML age page, or a redirect to login or to another step."
  errors: "The handler names no error code of its own."
  auth: "reads session"
"POST /welcome/age":
  why: "Records an adult confirmation, or blocks an under-age answer (interfaces/http/routes/welcome.ts)."
  input: "Form fields day, month and year."
  output: "303 to /welcome/terms, or to /welcome/blocked when under the minimum age."
  errors: "welcome.date_invalid when the date does not parse. service.unavailable when the block cannot be written."
  auth: "reads session"
"GET /welcome/terms":
  why: "Shows the terms and privacy step (interfaces/http/routes/welcome.ts)."
  input: "Optional query next."
  output: "HTML terms page, or a redirect to login or to another step."
  errors: "The handler names no error code of its own."
  auth: "reads session"
"POST /welcome/terms":
  why: "Records acceptance of the terms and privacy versions just shown (interfaces/http/routes/welcome.ts)."
  input: "Form fields accept, country, terms_version, privacy_version and next."
  output: "303 to /welcome/chat, to the checked next path, or to /did."
  errors: "welcome.terms_required when accept is not yes. welcome.country_required when the country rule applies and country is not yes."
  auth: "reads session"
"GET /welcome/chat":
  why: "Shows the chat onboarding step (interfaces/http/routes/welcome.ts). The screen is apps/web/src/screens/welcome/ChatLater.tsx. The heading is Chat comes later."
  input: "No request body."
  output: "HTML for that step, or a redirect to login or to another step."
  errors: "The handler names no error code of its own."
  auth: "reads session"
"POST /welcome/chat":
  why: "Finishes the chat step of onboarding (interfaces/http/routes/welcome.ts)."
  input: "Form body. The handler does not read form fields."
  output: "303 to /did when the email is confirmed, otherwise to /verify-email."
  errors: "The handler names no error code of its own."
  auth: "reads session"
"GET /welcome/blocked":
  why: "Shown when onboarding has blocked the account (interfaces/http/routes/welcome.ts)."
  input: "No request body."
  output: "HTML blocked page, or a redirect to the current step when the account is not blocked."
  errors: "The handler names no error code of its own."
  auth: "reads session"
"GET /settings/profile":
  why: "Placeholder app page the onboarding gate can refuse (interfaces/http/routes/settings.ts)."
  input: "No request body."
  output: "HTML profile page, or the gate's redirect."
  errors: "The handler returns the gate's redirect. It names no error code of its own."
  auth: "gate: openApp"
