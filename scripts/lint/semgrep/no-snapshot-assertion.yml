# TE-7, P1.26: a snapshot assertion hides a header or markup change. The one exception, the
# Hono-era CSP snapshot in shared/http/csp/, went with that code (P1.21c). Fixtures:
# scripts/lint/semgrep/fixtures/no-snapshot-assertion/, checked by scripts/lint/semgrep-fixtures.ts.
rules:
  - id: no-snapshot-assertion
    languages: [typescript]
    severity: ERROR
    message: >-
      toMatchSnapshot hides a change. Compare the value.
    paths:
      exclude:
        - "scripts/"
        - "tests/"
        - "**/*.test.ts"
        - "/scripts/lint/semgrep/fixtures/"
    pattern-either:
      - pattern: $X.toMatchSnapshot(...)
      - pattern: $X.toMatchInlineSnapshot(...)
