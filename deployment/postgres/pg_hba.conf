# The server's only client authentication file (P1.11y), copied into the postgres image at /etc/unset/pg_hba.conf and
# named by its CMD (`-c hba_file=`), so initdb's own $PGDATA/pg_hba.conf, with its trust lines, is never read. The
# first matching line decides (PostgreSQL 18 docs, 20.1). pg_hba.test.ts holds this file to exactly these lines.
#
# The superuser over the local socket only, as the OS user of the same name (the entrypoint's init scripts and an
# operator's `docker exec ... psql -U postgres`); any other role on the socket matches no line and is refused.
local   all   postgres                 peer
# The superuser never over TCP.
host    all   postgres   0.0.0.0/0     reject
host    all   postgres   ::/0          reject
# Every login role (migrator, web, tap, ...) over TCP with its SCRAM password.
host    all   all        0.0.0.0/0     scram-sha-256
host    all   all        ::/0          scram-sha-256
