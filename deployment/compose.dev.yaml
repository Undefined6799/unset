# The development stack (P1.29, P1.29a; plan section 8 Phase 1; step book phase-1.md P1.29 items 6 and 7): postgres,
# migrate, the PDS, the edge in front of it, and web, for the homelab, through the wrapper
# (deployment/preflight/stack.ts, P1.27w), which passes one interpolation file to the preflight and to Compose alike.
# A throwaway stack on one machine is compose.local.yaml (P1.34d), held to this file by compose.local.test.ts. Every image is built here from a Dockerfile images.yml scans;
# none is pulled, so the preflight's signed-image checks (C2 to C5) refuse this stack until P1.27s publishes signed
# images (architecture record 2026-10-12-p129-local-build-preflight). The one exception is the PDS, Bluesky's own image
# run as shipped (Alex, "Allow pinned", 2026-10-07T13:00:19Z): named here exactly as its run-only lock entry, which the
# mirror workflow scans (architecture record 2026-10-07-p129-migrate-image-and-run-only-images, point 2).
#
# Read under the preflight's strict subset (deployment/preflight/compose-parse.ts): no interpolation outside
# `environment`, no `healthcheck` (the postgres image carries its own), no `command`. Every service drops every
# capability, cannot gain privileges, runs as its image's non-root user on a read-only root, and has memory, CPU and
# process limits; a Node service's heap cap is at most 75 % of its memory limit (findings F-32).
#
# The secret files live in unset-dev-secrets/, a sibling of the repository checkout, never inside it: postgres builds
# from the repository root, and a build context that reaches the secrets folder fails C26 (architecture record
# 2026-10-12-p127u-bind-ancestors-and-build-context (b); a .dockerignore entry does not count). `file:` paths resolve
# from this file's folder, so ../../ is the checkout's parent. The interpolation file lives the same way in
# unset-dev-env/, beside the checkout, and the checkout keeps only its template, deployment/env/dev-public.example.env
# (Amendments 2 and 3 of the same record).
name: unset-dev

services:
  postgres:
    build:
      context: ..
      dockerfile: deployment/images/postgres.Dockerfile
    user: "999:999"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    # The socket directory and /tmp on tmpfs owned by the image's postgres user; the data on a named volume at the PG 18
    # image's VOLUME (docker-library/postgres 18/trixie/Dockerfile: `VOLUME /var/lib/postgresql`).
    tmpfs:
      - /var/run/postgresql:uid=999,gid=999,mode=0755
      - /tmp:uid=999,gid=999,mode=1777
    volumes:
      - pgdata:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_superuser_password
    secrets: [pg_superuser_password, pg_migrator_password, pg_tap_password]
    networks: [db]
    mem_limit: 1g
    cpus: 1
    pids_limit: 256
    restart: unless-stopped

  migrate:
    build:
      context: ..
      dockerfile: deployment/images/migrate.Dockerfile
    user: "65532:65532"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:uid=65532,gid=65532,mode=1777
    environment:
      UNSET_ENV: dev
      UNSET_COMMIT: "0000000000000000000000000000000000000000"
      PG_HOST: postgres
      PG_DATABASE: unset
      PG_USER: migrator
      PG_PASSWORD_FILE: /run/secrets/migrate_pg_password
      PG_SSLMODE: disable
      NODE_OPTIONS: --max-old-space-size=192
    # The migrator's own password and the role passwords syncRolePasswords sets (infrastructure/postgres/roles.json
    # passwordFrom), nothing else. Its copy of the migrator password is its own file: each mounted secret is owned by
    # the one uid that reads it, and postgres (999) reads the bootstrap copy (docs/human/runbooks/dev-stack-secrets.md).
    secrets: [migrate_pg_password, pg_web_password, pg_api_password, pg_indexer_password]
    depends_on:
      postgres:
        condition: service_healthy
    networks: [db]
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64
    restart: "no"

  # Bluesky's PDS, unmodified (@atproto/pds 0.5.37 in image 0.4.5037). Its image sets no USER, so it runs here as the
  # base's node user (uid 1000, nodejs/docker-node 24/alpine3.23/Dockerfile:5-6), with its data in a named volume at
  # that user's home: a fresh volume takes the owner of the directory it mounts over, and /home/node is node's, where a
  # new path would be root's. The PDS reads its settings from its environment only (dist/config/env.js); the pinned
  # ones are literals here, which Compose prefers over env_file, and pds.env holds only its secrets and recovery key
  # (deployment/env/pds.example.env). Not set, on purpose: PDS_DEV_MODE, PDS_DISABLE_SSRF_PROTECTION (F-25) or any
  # other PDS DISABLE switch but C16's (no_pds_disable_or_dev_mode_variable), PDS_LEXICON_AUTHORITY_DID, any
  # PDS_RATE_LIMIT_BYPASS_ name, LOG_LEVEL, the AppView and report service (optional, dist/config/config.js:162-189),
  # and the mail URLs (no mail is sent; pds_mail_unset_only_with_logging_off).
  pds:
    image: ghcr.io/bluesky-social/pds:0.4.5037@sha256:3a8feb3415e319dbcc13372293b7ef1fb05a318a6ff1d55968cf99ba6633c5d4
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:uid=1000,gid=1000,mode=1777
    volumes:
      - pdsdata:/home/node
    env_file: ../../unset-dev-env/pds.env
    environment:
      PDS_HOSTNAME: ${PDS_HOSTNAME}
      PDS_SERVICE_HANDLE_DOMAINS: ${PDS_SERVICE_HANDLE_DOMAINS}
      PDS_PORT: "3000"
      PDS_DATA_DIRECTORY: /home/node/pds
      PDS_BLOBSTORE_DISK_LOCATION: /home/node/pds/blocks
      PDS_DID_PLC_URL: https://plc.directory
      PDS_INVITE_REQUIRED: "true"
      PDS_CRAWLERS: ""
      PDS_RATE_LIMITS_ENABLED: "false"
      PDS_EMAIL_DISABLE_CONFIRMATION_LINK: "true"
      LOG_ENABLED: "false"
      NODE_OPTIONS: --max-old-space-size=768
    networks: [edge, pds_egress]
    mem_limit: 1g
    cpus: 1
    pids_limit: 256
    restart: unless-stopped

  # The edge (P1.28 image), the only service that publishes, and on loopback only: the homelab's own address is P1.34's.
  # Its sites are the repository's deployment/edge/sites, mounted read-only where the image imports them, as C18 reads
  # them; /data (ACME state) and /config are named volumes the image seeds as caddy's, 0700 (P1.27o).
  edge:
    # A file named Dockerfile builds from its own folder, as images.yml builds it (C26).
    build:
      context: ./edge
      dockerfile: Dockerfile
    user: "65532:65532"
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:uid=65532,gid=65532,mode=1777
    volumes:
      - ./edge/sites:/etc/caddy/sites/enabled:ro
      - edgedata:/data
      - edgeconfig:/config
    environment:
      PDS_HOST: ${PDS_HOSTNAME}
      PDS_UPSTREAM: pds:3000
      ACME_EMAIL: ${EDGE_ACME_EMAIL}
    ports:
      - 127.0.0.1:80:80
      - 127.0.0.1:443:443
    depends_on:
      pds:
        condition: service_started
    # The PDS reaches the app's host and its own through these names on the network it shares with the edge, and web
    # through the same names on the app network, never extra_hosts or a fixed address (architecture record
    # 2026-10-13-p129a-pds-and-edge-in-compose, Amendment 1; architecture 2026-10-15 02:05Z, option C).
    networks:
      edge:
        aliases: ["${APP_HOST}", "${PDS_HOSTNAME}"]
      app:
        aliases: ["${APP_HOST}", "${PDS_HOSTNAME}"]
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: deployment/images/node-app.Dockerfile
    user: "65532:65532"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:uid=65532,gid=65532,mode=1777
    environment:
      UNSET_ENV: dev
      UNSET_SERVICE: http
      UNSET_COMMIT: "0000000000000000000000000000000000000000"
      LISTEN_PORT: "8080"
      PUBLIC_ORIGIN: ${WEB_PUBLIC_ORIGIN}
      HTTP_ALLOWED_HOSTS: ${WEB_ALLOWED_HOSTS}
      MEDIA_ORIGIN: ${WEB_MEDIA_ORIGIN}
      # Only the edge reaches web, on the app network, and its upstream snippet drops the client's address, so the
      # address is the socket's (shared/http/config.ts TRUSTED_PROXY_MODE).
      TRUSTED_PROXY_MODE: socket
      NODE_OPTIONS: --max-old-space-size=384
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [db, app]
    mem_limit: 512m
    cpus: 1
    pids_limit: 128
    restart: unless-stopped

networks:
  db:
    internal: true
  # web's only way to the edge. web reaches the PDS only through the edge's aliases on this network, never directly.
  # Internal, so web still has no way out. Record: the 02:05Z (option C) and 02:21Z sections of
  # unset-plan/book-edits/2026-10-14-p134d-split.md.
  app:
    internal: true
  # Only the edge shares a network with the PDS's HTTP port: the PDS trusts every private address as a proxy (step book
  # P1.29, "Networks"). pds_egress is the PDS's own way out (PLC, DID and handle resolution, client metadata).
  edge:
  pds_egress:

volumes:
  pgdata:
  pdsdata:
  edgedata:
  edgeconfig:

secrets:
  pg_superuser_password:
    file: ../../unset-dev-secrets/pg_superuser_password
  pg_migrator_password:
    file: ../../unset-dev-secrets/pg_migrator_password
  pg_tap_password:
    file: ../../unset-dev-secrets/pg_tap_password
  migrate_pg_password:
    file: ../../unset-dev-secrets/migrate_pg_password
  pg_web_password:
    file: ../../unset-dev-secrets/pg_web_password
  pg_api_password:
    file: ../../unset-dev-secrets/pg_api_password
  pg_indexer_password:
    file: ../../unset-dev-secrets/pg_indexer_password
