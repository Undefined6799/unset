# Synapse's logging (P6.02; a Python logging dictConfig, docs.python.org/3/library/logging.config.html, as
# config_documentation.md:1643 at v1.165.0 says). Warnings and errors to stderr only. The access logger,
# synapse.access.http.<port> (synapse/app/_base.py:478 at v1.165.0), writes a user id and an address for every
# request, so its parent has no handler and does not propagate (rule SE-7).
version: 1
formatters:
  plain:
    format: "%(asctime)s %(levelname)s %(name)s %(message)s"
handlers:
  stderr:
    class: logging.StreamHandler
    formatter: plain
loggers:
  synapse.access.http:
    handlers: []
    propagate: false
root:
  level: WARNING
  handlers: [stderr]
disable_existing_loggers: false
