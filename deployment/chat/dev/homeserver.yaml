# Synapse 1.165.0 for the staging chat server (P6.02; ADR 0086; build plan step 1). Every key and value here is
# read by preflight C36 (deployment/preflight/checks/chat.ts), which refuses a wrong value and any key it does not
# list. Secrets are only paths under /run/secrets, never values. Each key is documented in
# https://github.com/element-hq/synapse/blob/v1.165.0/docs/usage/configuration/config_documentation.md (read
# 2026-11-21); line numbers below are that file's.

# The domain in every chat id (ADR 0025: staging.unset.cc in development, unset.cc in production; :128, :217).
server_name: staging.unset.cc
public_baseurl: https://staging.unset.cc/

# One client listener and nothing else: no federation, openid, metrics or replication resource (:498). The socket's
# address is the client's, never a forwarded header (x_forwarded false), so Synapse records only our own hop.
listeners:
  - port: 8008
    bind_addresses: ["0.0.0.0"]
    type: http
    tls: false
    x_forwarded: false
    resources:
      - names: [client]
        compress: false

# Its own database and role in our Postgres (:1519). libpq reads the password from a passfile
# (postgresql.org/docs/current/libpq-connect.html, "passfile"), so the config holds no password.
database:
  name: psycopg2
  args:
    host: postgres
    dbname: synapse
    user: synapse
    passfile: /run/secrets/synapse_pgpass
    sslmode: disable
    cp_min: 2
    cp_max: 5

# Root at WARNING and the access log dropped (log.yaml): its lines carry a user id and an address (:1643).
log_config: /config/log.yaml
media_store_path: /data/media
signing_key_path: /run/secrets/synapse_signing_key
macaroon_secret_key_path: /run/secrets/synapse_macaroon_secret_key
form_secret_path: /run/secrets/synapse_form_secret

# Nothing phones home or asks a key server (:3238, :3464).
report_stats: false
trusted_key_servers: []

# "Specifying an empty list ([]) here is the recommended way of disabling federation" (:1310).
federation_domain_whitelist: []
allow_profile_lookup_over_federation: false

# Nobody registers or browses as a guest; accounts come only from MAS's admin API (:2740, :2886).
enable_registration: false
allow_guest_access: false

# Every new room is encrypted (:4049).
encryption_enabled_by_default_for_room_type: all

# Names and pictures can't be faked, per room or at all (:2934, :2947, :1028).
enable_set_displayname: false
enable_set_avatar_url: false
allow_per_room_profiles: false

# Profiles are not open to lookups, and there is no member search (:312, :322, :4070).
require_auth_for_profile_requests: true
limit_profile_requests_to_users_who_share_rooms: true
user_directory:
  enabled: false

# No link previews (:2415). Client addresses are kept one day (:1103).
url_preview_enabled: false
user_ips_max_age: 1d

# Sign-in is MAS's (:683-702). The endpoint is MAS's listener for Synapse, which serves discovery and oauth.
matrix_authentication_service:
  enabled: true
  endpoint: http://mas:8080/
  secret_path: /run/secrets/synapse_mas_secret

# The server rule (P6.10a; ADR 0085): refuses every room event but an encrypted one. Its package is
# infrastructure/matrix/synapse-module/, which our Synapse image carries (deployment/images/synapse.Dockerfile); it takes no config
# (:103).
modules:
  - module: unset_chat_policy.EncryptedOnly
    config: {}
