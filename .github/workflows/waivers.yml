# The daily look at every dated waiver (P1.38p): .github/trivyignore*.yaml and .github/npm-audit-ignore.yaml. It
# fails when an entry has expired or expires within seven days (scripts/ci/waiver-expiry.ts), so a renewal or a fix is
# decided before a scan goes red. It is not a required pull-request check: a date passing is nobody's pull request,
# and the required `check` job judges only what a pull request can change. A passed date is still enforced where the
# waiver is used: Trivy stops honouring the entry in the image scans, and the audit job refuses an expired npm entry.
# The `expiry` job reads only, holds no secret and no environment, and never commits, pushes or opens a PR.
# When it fails, the `notify` job (P1.38r) says so where the owner will see it: one open issue with a fixed title,
# assigned to the repository owner, with a comment per failed run. That job checks out nothing and runs no repository
# code, and `issues: write` is its only permission, so the job that runs `npm ci` still cannot write anywhere.
# (GITHUB_TOKEN with `gh issue`: docs.github.com/en/actions/tutorials/authenticate-with-github_token, read 2026-11-15.)
# scripts/guards/workflows.ts names this file by its SHA-256: any edit here, a comment included, needs the new hash
# there, so a change to the job that holds the write token is always a change to the guard too.

name: waivers

on:
  schedule:
    - cron: "41 6 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: waivers
  cancel-in-progress: true

jobs:
  expiry:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: node scripts/ci/waiver-expiry.ts

  notify:
    needs: expiry
    if: failure()
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      OWNER: ${{ github.repository_owner }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      TITLE: A dated waiver has expired or expires within seven days
    steps:
      - run: |
          body="The daily waivers job failed: ${RUN_URL}. Its log names each entry and its date. Renew the waiver with a reason or land the fix; this issue can be closed once the job is green again."
          number="$(gh issue list --state open --search "in:title \"${TITLE}\"" --json number,title --jq "map(select(.title == env.TITLE)) | .[0].number // empty")"
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$TITLE" --body "$body" --assignee "$OWNER"
          fi
