# The daily look at every dated waiver (P1.38p): .github/trivyignore*.yaml and .github/npm-audit-ignore.yaml. It
# fails when an entry has expired or expires within seven days (scripts/ci/waiver-expiry.ts), so a renewal or a fix is
# decided before a scan goes red. It is not a required pull-request check: a date passing is nobody's pull request,
# and the required `check` job judges only what a pull request can change. A passed date is still enforced where the
# waiver is used: Trivy stops honouring the entry in the image scans, and the audit job refuses an expired npm entry.
# It reads only, holds no secret and no environment, and never commits, pushes or opens a PR.

name: waivers

on:
  schedule:
    - cron: "41 6 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: waivers
  cancel-in-progress: true

jobs:
  expiry:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: node scripts/ci/waiver-expiry.ts
