# Publish, sign and attest our first-party images (P1.27s; ADR 0033, keyless). On a push to main, one job builds each
# image under deployment/ from the checked-out commit, pushes it by digest, scans that digest, signs it and attests its
# SLSA provenance and SPDX SBOM with keyless cosign (a Fulcio certificate for exactly this workflow on refs/heads/main,
# recorded in public Rekor), then verifies the lock it just wrote with scripts/ci/verify-images.ts. A second job, bump,
# then opens the lock-bump pull request from that lock (P2.26m; see the job). It never runs for a
# pull request: it has no pull_request trigger (the workflow guard refuses one), and images.yml stays the unprivileged
# PR check. It has no manual trigger either, since the job's `if:` would skip a dispatched run; a new publish is a push.
#
# The gate (scripts/guards/workflows.ts): the job runs in the `signing` environment (main only, Alex as required
# reviewer, so each run waits for his approval) and its `if:` is exactly the push-to-main condition. Only the publish job
# holds `packages: write`, and only it and mirror.yml's copy-and-sign job hold `id-token: write`. No cache of any kind.
#
# cosign v3.1.3 (2026-08-05; v3.1.4 of 2026-10-20 is inside the seven-day rule) is pinned by its release checksum.
# Its sign and attest defaults upload to Rekor through the public-good signing config and write the new bundle format
# beside the image (cmd/cosign/cli/options/sign.go and attest.go at the tag); no flag here turns either off.

name: publish-images

# P2.26k: a push that changes only docs/ or tests/ starts no run, so it asks for no approval. No image build reads
# either folder: the root .dockerignore leaves both out of the root build context, and every other context is a folder
# under deployment/ (scripts/ci/image-workflows.test.ts, publish_skips_only_what_no_image_reads). `paths-ignore` skips
# a push only when every changed file matches, and the run starts anyway when the diff cannot be made (more than 1,000
# commits, or a timeout): docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax,
# on.<push|pull_request>.<paths|paths-ignore>, read 2026-11-15.
on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "tests/**"
      # P2.26m: the two files a lock bump changes. Without this, merging a bump would publish again and open the next
      # bump. The root .dockerignore leaves both out of every build (same test).
      - "deployment/images.lock.json"
      - "deployment/compose.dev.yaml"

permissions: {}

concurrency:
  group: publish-images
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: signing
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      lock: ${{ steps.lock.outputs.lock }}
    env:
      REGISTRY: ghcr.io/undefined6799/unset
      COSIGN_VERSION: v3.1.3
      COSIGN_SHA256: 4629c757b7618056f8ddd7e2625ae9fdd94c0372a65049520bc7d9df9efc7f71
      TRIVY_IMAGE: aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb
      SYFT_IMAGE: anchore/syft:v1.57.2@sha256:e97e20b6e6d1699c60296b66ab337941724f9bd06ac279d893eda89601fc4b2a
      # BuildKit v0.34.2 (released 2026-11-03, outside the seven-day rule), by its index digest.
      BUILDKIT_IMAGE: moby/buildkit:v0.35.1@sha256:baf6138eb8c37644800c7c913fba051e840ebb9ba13eaf92d92ef9a1712d0b4c
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install cosign by checksum
        run: |
          curl -sSfL -o "$RUNNER_TEMP/cosign" \
            "https://github.com/sigstore/cosign/releases/download/$COSIGN_VERSION/cosign-linux-amd64"
          echo "$COSIGN_SHA256  $RUNNER_TEMP/cosign" | sha256sum -c -
          install -m 0755 "$RUNNER_TEMP/cosign" /usr/local/bin/cosign
      - name: Log in to GHCR
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      # The default docker driver refuses push-by-digest ("push-by-digest is currently not implemented for docker
      # driver", run 39520078609), so the images build on a docker-container builder running the pinned BuildKit
      # (docs.docker.com/build/builders/drivers/docker-container, driver-opt image). Its pushes carry BuildKit's default
      # mode=min provenance as a manifest in the image index (docs.docker.com/build/metadata/attestations), so each
      # locked digest names an index; cosign's own provenance and SBOM attestations below are unchanged.
      - name: Create the BuildKit builder
        run: docker buildx create --use --name publish --driver docker-container --driver-opt "image=$BUILDKIT_IMAGE"
      # One digest: each image is pushed by digest, and that digest alone is scanned, signed, attested and locked.
      - name: Build, push, scan, sign and attest
        shell: bash
        run: |
          GITHUB_OUTPUT="$RUNNER_TEMP/list" node scripts/ci/list-dockerfiles.ts
          sed -n 's/^images=//p' "$RUNNER_TEMP/list" | jq -r '.[] | [.name, .dockerfile, .ignorefile] | @tsv' > "$RUNNER_TEMP/images"
          test -s "$RUNNER_TEMP/images"
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export SOURCE_DATE_EPOCH
          echo '{}' > "$RUNNER_TEMP/images.lock.json"
          while IFS=$'\t' read -r name dockerfile ignorefile; do
            case "$dockerfile" in */Dockerfile) context="${dockerfile%/*}" ;; *) context=. ;; esac
            case "$name" in node-app) name=web ;; esac
            docker buildx build --platform linux/amd64 --build-arg SOURCE_DATE_EPOCH -f "$dockerfile" \
              --output "type=image,name=$REGISTRY/$name,push-by-digest=true,name-canonical=true,push=true" \
              --metadata-file "$RUNNER_TEMP/meta.json" "$context" < /dev/null
            ref="$REGISTRY/$name@$(jq -r '."containerimage.digest"' "$RUNNER_TEMP/meta.json")"
            case "$ref" in *@sha256:????????????????????????????????????????????????????????????????) ;; *) exit 1 ;; esac
            # Scanned as images.yml scans it (list-dockerfiles.ts): with that image's ignore file, /dev/null for every
            # image but the paired PDS recipe (.github/trivyignore.pds.yaml, P2.24t), and under the same local name
            # unset-scan/<name>:ci, because Trivy matches an OS-package entry's paths against the scan target's name
            # (v0.75.0 pkg/result/filter.go:90-94, ignore.go:81-103). The local image is the pushed digest itself:
            # it is pulled by that digest and must list it among its RepoDigests before it is scanned.
            docker pull --quiet --platform linux/amd64 "$ref" > /dev/null
            docker image inspect --format '{{join .RepoDigests "\n"}}' "$ref" | grep -qxF "$ref"
            docker tag "$ref" "unset-scan/$name:ci"
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/repo:ro" -w /repo "$TRIVY_IMAGE" \
              image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed --ignorefile "$ignorefile" --timeout 10m \
              "unset-scan/$name:ci"
            docker run --rm -v "$HOME/.docker/config.json:/root/.docker/config.json:ro" "$SYFT_IMAGE" \
              "registry:$ref" -o spdx-json > "$RUNNER_TEMP/sbom.json"
            jq -n --arg repo "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" --arg ref "$GITHUB_REF" --arg sha "$GITHUB_SHA" \
              --arg run "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT" \
              '{buildDefinition: {buildType: "https://actions.github.io/buildtypes/workflow/v1",
                externalParameters: {workflow: {ref: $ref, repository: $repo, path: ".github/workflows/publish-images.yml"}},
                resolvedDependencies: [{uri: ("git+" + $repo + "@" + $ref), digest: {gitCommit: $sha}}]},
                runDetails: {builder: {id: $run}}}' > "$RUNNER_TEMP/provenance.json"
            cosign sign --yes "$ref" < /dev/null
            cosign attest --yes --type slsaprovenance1 --predicate "$RUNNER_TEMP/provenance.json" "$ref" < /dev/null
            cosign attest --yes --type spdxjson --predicate "$RUNNER_TEMP/sbom.json" "$ref" < /dev/null
            # The entry names the commit the provenance attests, so verify-images binds the two (P2.26h).
            jq --arg name "$name" --arg ref "$ref" --arg sha "$GITHUB_SHA" \
              '.[$name] = {ref: $ref, origin: "first-party", gitCommit: $sha, verify: "cosign-keyless"}' \
              "$RUNNER_TEMP/images.lock.json" > "$RUNNER_TEMP/lock.next" && mv "$RUNNER_TEMP/lock.next" "$RUNNER_TEMP/images.lock.json"
            echo "- $ref" >> "$GITHUB_STEP_SUMMARY"
          done < "$RUNNER_TEMP/images"
      - name: Verify what was published
        run: node scripts/ci/verify-images.ts "$RUNNER_TEMP/images.lock.json"
      # P2.26m: only a lock that verified is handed on, as one line of JSON. It holds digests and the commit, no secret.
      - name: Hand the verified lock to the bump job
        id: lock
        run: echo "lock=$(jq -c . "$RUNNER_TEMP/images.lock.json")" >> "$GITHUB_OUTPUT"

  # P2.26m: opens the pull request that bumps deployment/images.lock.json and the digests in compose.dev.yaml to what
  # the job above just published, so nobody types digests by hand. It runs only after publish succeeded, on the same
  # push-to-main condition, from the checkout of the published commit, and runs one script. It holds contents: write
  # and pull-requests: write to push a `lock-bump/…` branch and open the pull request; it holds no id-token, no
  # packages scope and no environment, so it cannot sign or push an image, and the publish job gains nothing. It never
  # merges directly: the pull request is judged by lock.yml (P2.26j) and the required checks like any other, and
  # main's ruleset still refuses a direct push. While that ruleset requires the `lock` check, the script turns on
  # GitHub's auto-merge for the pull request it opened (P2.26n, ADR 0047); otherwise a person merges. scripts/guards/workflows.ts pins this job line for line (BUMP_JOB_LINES): an edit
  # here, an action bump included, edits the guard too.
  #
  # Operating it (GitHub docs read 2026-11-15; unverified until the first run on main):
  # - The repository setting "Allow GitHub Actions to create and approve pull requests" (Settings, Actions, General,
  #   Workflow permissions) must be on, or opening the pull request fails. It is off by default for a personal
  #   repository (docs.github.com/en/repositories/managing-your-repositorys-settings-and-features/
  #   enabling-features-for-your-repository/managing-github-actions-settings-for-a-repository).
  # - The pull request's checks do not start by themselves. A pull request opened with GITHUB_TOKEN creates its
  #   runs "in an approval-required state"; the owner starts them with "Approve workflows to run" in the pull
  #   request's merge box (docs.github.com/en/actions/concepts/security/github_token). Should no banner show, closing
  #   and reopening the pull request as a person starts them.
  # - Each publish run opens its own pull request. Merge the newest (or let it merge itself) and close older ones: a bump names every
  #   first-party image, so the newest covers them, and lock.yml refuses an older one once a newer is merged.
  bump:
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          PUBLISHED_LOCK: ${{ needs.publish.outputs.lock }}
        run: node scripts/ci/lock-bump-pr.ts
