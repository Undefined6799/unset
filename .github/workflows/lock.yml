# Judges a pull request's change to the deploy lock, deployment/images.lock.json (P2.26j). Read-only: no write scope,
# no secret, no environment. Until this step a bumped lock was first verified on the host, by the deploy preflight.
#
# scripts/ci/lock-bump.ts fails when a first-party entry the pull request changes names a commit that is not on main
# or is older than the locked one, and says whether the lock changed at all. When it did, the pinned cosign verifies
# every entry with scripts/ci/verify-images.ts against the committed Sigstore trusted root, as the preflight does
# (P2.26b): exact workflow identity, provenance naming the entry's commit, no trust material fetched (ADR 0033,
# Decisions 2 to 4). The images are public, so cosign reads their bundles from GHCR without a login.
#
# No `paths:` filter: the job always starts, so it can become a required check without blocking other pull requests
# (docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax, on.<event>.paths: a workflow skipped by
# a path filter leaves its checks pending). Drafts are skipped, as in ci.yml (P0.09l).
#
# cosign is the version and checksum publish-images.yml signs with; scripts/ci/lock-bump.test.ts keeps the two equal.

name: lock

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

concurrency:
  group: lock-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lock:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      COSIGN_VERSION: v3.1.3
      COSIGN_SHA256: 4629c757b7618056f8ddd7e2625ae9fdd94c0372a65049520bc7d9df9efc7f71
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - id: bump
        run: node scripts/ci/lock-bump.ts
      - name: Install cosign by checksum
        if: steps.bump.outputs.changed == 'true'
        run: |
          curl -sSfL -o "$RUNNER_TEMP/cosign" \
            "https://github.com/sigstore/cosign/releases/download/$COSIGN_VERSION/cosign-linux-amd64"
          echo "$COSIGN_SHA256  $RUNNER_TEMP/cosign" | sha256sum -c -
          install -m 0755 "$RUNNER_TEMP/cosign" /usr/local/bin/cosign
      - name: Verify every locked image
        if: steps.bump.outputs.changed == 'true'
        run: node scripts/ci/verify-images.ts deployment/images.lock.json --trusted-root deployment/sigstore/trusted_root.json
