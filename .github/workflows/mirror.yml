# Upstream images we run (P1.27q): every `source` in deployment/mirror.list.json is scanned by digest with Trivy, on
# a change to main and weekly, so a newly published CVE in an image we already pinned turns this red. Copying into
# the private GHCR mirror and signing it need `packages: write` and the `signing` environment, which wait on Alex
# (see the P1.27q PR); until P1.27 adds the list the job prints a notice and passes. This workflow is not a required
# pull-request check; the list's own rules (digest only) are unit tests that run in `check`.

name: mirror

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * 1"

permissions: {}

concurrency:
  group: mirror
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      MIRROR_LIST: deployment/mirror.list.json
      BASES_LOCK: deployment/images/bases.lock.json
      TRIVY_IMAGE: aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scan every upstream source by digest
        # `shell: bash` runs the step as `bash --noprofile --norc -eo pipefail {0}`; with no shell key Actions runs
        # `bash -e {0}`, and the HIGH run's status would be tee's (P1.28w; docs.github.com workflow syntax, "shell").
        shell: bash
        run: |
          if [ ! -e "$MIRROR_LIST" ]; then
            echo "::notice title=mirror::skipped, no mirror list yet (lands in P1.27)"
            exit 0
          fi
          jq -r '.[] | [.source, (.stage // "none")] | @tsv' "$MIRROR_LIST" > "$RUNNER_TEMP/entries"
          test -s "$RUNNER_TEMP/entries"
          # The lock is read for every entry, so a missing lock, or one that is not an object, fails here (P1.29v).
          jq -e 'type == "object"' "$BASES_LOCK" > /dev/null
          # One Trivy cache for every run in this job, so the vulnerability database downloads once (P1.28w).
          cache="$RUNNER_TEMP/trivy-cache"
          mkdir -p "$cache"
          # Per stage (P1.28v, Alex's "Warn on build-only" 2026-10-07T03:56:37Z): a runtime base fails on HIGH or
          # CRITICAL; a build-only base fails on CRITICAL and only reports HIGH, as a warning and in the job summary,
          # because what ships is gated by the image jobs' own scans. Trivy v0.74.0 exits with --exit-code when it
          # finds anything at --severity, so exit 2 below means HIGH findings and any other non-zero is a failure.
          # P1.34m (record unset-plan/book-edits/2026-10-13-p134m-pr-scan-new-runtime-pins.md, Amendment 2): a failing
          # scan no longer stops the loop, so one red base cannot hide the ones after it. Each failing source gets an
          # error annotation naming it (docs.github.com workflow commands, "Setting an error message"), and the step
          # fails after the last source. A list or lock problem still fails at once.
          failed=0
          while IFS=$'\t' read -r source stage; do
            case "$source" in *@sha256:*) ;; *) echo "not pinned by digest: $source"; exit 1 ;; esac
            # P1.29v (Alex's card "Skip stripped files", 2026-10-07T18:56:42Z): the paths a runtime entry's lock entry
            # declares `stripped` are left out of this vulnerability scan, because every final stage on the base
            # deletes them (stripped_paths_removed_in_every_final_stage). images.yml's vulnerability scan of each
            # shipped image passes no --skip-dirs and no --skip-files.
            # P1.33u: this job scans mirrored images for vulnerabilities.
            # It does not yet secret-scan their exported filesystems, although pds and others ship unmodified.
            # P1.33v adds that scan and rewrites this comment.
            # P1.29b: a build-only entry is scanned in full, its declared paths included, because a build stage runs
            # them before they are deleted. Trivy v0.75.0 skips a directory's contents only through --skip-dirs and a
            # file only through --skip-files (pkg/fanal/walker/tar.go:66-81), so each path is passed to both. The
            # lock's paths are literal, absolute and free of glob characters (STRIPPED_PATH in images.test.ts).
            skip=()
            if [ "$stage" = runtime ]; then
              stripped="$(jq -r --arg source "$source" \
                '.[] | select("\(.ref):\(.tag)@\(.digest)" == $source) | .stripped // [] | .[]' "$BASES_LOCK")"
              while IFS= read -r path; do
                if [ -n "$path" ]; then skip+=(--skip-dirs "$path" --skip-files "$path"); fi
              done <<< "$stripped"
            fi
            case "$stage" in
              runtime) severity=HIGH,CRITICAL ;;
              build)
                severity=CRITICAL
                status=0
                { echo "### HIGH findings in build-only base $source"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
                docker run --rm -v "$PWD:/repo:ro" -v "$cache:/root/.cache/trivy" -w /repo "$TRIVY_IMAGE" \
                  image --exit-code 2 --severity HIGH \
                  --ignore-unfixed --ignorefile .github/trivyignore.yaml --timeout 10m "$source" \
                  | tee -a "$GITHUB_STEP_SUMMARY" || status=$?
                echo '```' >> "$GITHUB_STEP_SUMMARY"
                case "$status" in
                  0) ;;
                  2) echo "::warning title=mirror::HIGH findings in build-only base $source (reported, not failing)" ;;
                  *) echo "::error title=mirror::scan failed (exit $status) for $source"; failed=$((failed + 1)); continue ;;
                esac
                ;;
              *) echo "no known stage for $source: $stage"; exit 1 ;;
            esac
            status=0
            docker run --rm -v "$PWD:/repo:ro" -v "$cache:/root/.cache/trivy" -w /repo "$TRIVY_IMAGE" \
              image --exit-code 1 --severity "$severity" \
              --ignore-unfixed --ignorefile .github/trivyignore.yaml --timeout 10m "${skip[@]}" "$source" || status=$?
            if [ "$status" -ne 0 ]; then
              echo "::error title=mirror::scan failed (exit $status) for $source"
              failed=$((failed + 1))
            fi
          done < "$RUNNER_TEMP/entries"
          if [ "$failed" -gt 0 ]; then
            echo "$failed upstream source(s) failed the scan"
            exit 1
          fi
