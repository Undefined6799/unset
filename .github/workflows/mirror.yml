# Upstream images we run (P1.27q): every `source` in deployment/mirror.list.json is scanned by digest with Trivy, on
# a change to main and weekly, so a newly published CVE in an image we already pinned turns this red. This workflow is
# not a required pull-request check; the list's own rules (digest only) are unit tests that run in `check`.
#
# P1.27s (ADR 0033): on a push to main, after the scan passes, copy-and-sign copies each source into its GHCR mirror
# by the same digest and signs that digest with keyless cosign (a certificate for exactly this workflow on
# refs/heads/main, in public Rekor), then verifies the mirror lock it wrote. It runs in the `signing` environment with
# `packages: write` and `id-token: write`, the only job besides publish-images.yml's publish to hold them, and never
# on the weekly schedule. crane v0.22.1 (go-containerregistry) copies "while retaining the digest value" (crane copy
# --help at the tag); the job reads each copy's digest back and fails on any difference. cosign v3.1.3 and crane are
# pinned by their release checksums.

name: mirror

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * 1"

permissions: {}

concurrency:
  group: mirror
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      MIRROR_LIST: deployment/mirror.list.json
      BASES_LOCK: deployment/images/bases.lock.json
      TRIVY_IMAGE: aquasec/trivy:0.76.0@sha256:2416d1f74045b57274df1a340eee6b510cacd73c66a6ccb8da092b117eb7d222
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scan every upstream source by digest
        # `shell: bash` runs the step as `bash --noprofile --norc -eo pipefail {0}`; with no shell key Actions runs
        # `bash -e {0}`, and the HIGH run's status would be tee's (P1.28w; docs.github.com workflow syntax, "shell").
        shell: bash
        run: |
          if [ ! -e "$MIRROR_LIST" ]; then
            echo "::notice title=mirror::skipped, no mirror list yet (lands in P1.27)"
            exit 0
          fi
          jq -r '.[] | [.source, (.stage // "none")] | @tsv' "$MIRROR_LIST" > "$RUNNER_TEMP/entries"
          test -s "$RUNNER_TEMP/entries"
          # The lock is read for every entry, so a missing lock, or one that is not an object, fails here (P1.29v).
          jq -e 'type == "object"' "$BASES_LOCK" > /dev/null
          # One Trivy cache for every run in this job, so the vulnerability database downloads once (P1.28w).
          cache="$RUNNER_TEMP/trivy-cache"
          mkdir -p "$cache"
          # Per stage (P1.28v, Alex's "Warn on build-only" 2026-10-07T03:56:37Z): a runtime base fails on HIGH or
          # CRITICAL; a build-only base fails on CRITICAL and only reports HIGH, as a warning and in the job summary,
          # because what ships is gated by the image jobs' own scans. Trivy v0.74.0 exits with --exit-code when it
          # finds anything at --severity, so exit 2 below means HIGH findings and any other non-zero is a failure.
          # P1.34m (record unset-plan/book-edits/2026-10-13-p134m-pr-scan-new-runtime-pins.md, Amendment 2): a failing
          # scan no longer stops the loop, so one red base cannot hide the ones after it. Each failing source gets an
          # error annotation naming it (docs.github.com workflow commands, "Setting an error message"), and the step
          # fails after the last source. A list or lock problem still fails at once.
          failed=0
          while IFS=$'\t' read -r source stage; do
            case "$source" in *@sha256:*) ;; *) echo "not pinned by digest: $source"; exit 1 ;; esac
            # P1.33c (Alex's typed line "yes PDS exceptions .github/trivyignore.pds.yaml
            # .github/workflows/images.yml .github/workflows/mirror.yml scripts/ci", 2026-10-16):
            # only ghcr.io/bluesky-social/pds reads the PDS ignore file. Every other source,
            # including caddy:2.11.7-alpine, keeps the shared file.
            ignorefile=.github/trivyignore.yaml
            case "$source" in
              ghcr.io/bluesky-social/pds:*|ghcr.io/bluesky-social/pds@*)
                ignorefile=.github/trivyignore.pds.yaml
                ;;
            esac
            # P1.29v (Alex's card "Skip stripped files", 2026-10-07T18:56:42Z): the paths a runtime entry's lock entry
            # declares `stripped` are left out of this vulnerability scan, because every final stage on the base
            # deletes them (stripped_paths_removed_in_every_final_stage). images.yml's vulnerability scan of each
            # shipped image passes no --skip-dirs and no --skip-files.
            # P1.33u: this job scans mirrored images for vulnerabilities.
            # It does not yet secret-scan their exported filesystems, although pds and others ship unmodified.
            # P1.33v adds that scan and rewrites this comment.
            # P1.29b: a build-only entry is scanned in full, its declared paths included, because a build stage runs
            # them before they are deleted. Trivy v0.75.0 skips a directory's contents only through --skip-dirs and a
            # file only through --skip-files (pkg/fanal/walker/tar.go:66-81), so each path is passed to both. The
            # lock's paths are literal, absolute and free of glob characters (STRIPPED_PATH in images.test.ts).
            skip=()
            if [ "$stage" = runtime ]; then
              stripped="$(jq -r --arg source "$source" \
                '.[] | select("\(.ref):\(.tag)@\(.digest)" == $source) | .stripped // [] | .[]' "$BASES_LOCK")"
              while IFS= read -r path; do
                if [ -n "$path" ]; then skip+=(--skip-dirs "$path" --skip-files "$path"); fi
              done <<< "$stripped"
            fi
            case "$stage" in
              runtime) severity=HIGH,CRITICAL ;;
              build)
                severity=CRITICAL
                status=0
                { echo "### HIGH findings in build-only base $source"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
                docker run --rm -v "$PWD:/repo:ro" -v "$cache:/root/.cache/trivy" -w /repo "$TRIVY_IMAGE" \
                  image --exit-code 2 --severity HIGH \
                  --ignore-unfixed --ignorefile "$ignorefile" --timeout 10m "$source" \
                  | tee -a "$GITHUB_STEP_SUMMARY" || status=$?
                echo '```' >> "$GITHUB_STEP_SUMMARY"
                case "$status" in
                  0) ;;
                  2) echo "::warning title=mirror::HIGH findings in build-only base $source (reported, not failing)" ;;
                  *) echo "::error title=mirror::scan failed (exit $status) for $source"; failed=$((failed + 1)); continue ;;
                esac
                ;;
              *) echo "no known stage for $source: $stage"; exit 1 ;;
            esac
            status=0
            docker run --rm -v "$PWD:/repo:ro" -v "$cache:/root/.cache/trivy" -w /repo "$TRIVY_IMAGE" \
              image --exit-code 1 --severity "$severity" \
              --ignore-unfixed --ignorefile "$ignorefile" --timeout 10m "${skip[@]}" "$source" || status=$?
            if [ "$status" -ne 0 ]; then
              echo "::error title=mirror::scan failed (exit $status) for $source"
              failed=$((failed + 1))
            fi
          done < "$RUNNER_TEMP/entries"
          if [ "$failed" -gt 0 ]; then
            echo "$failed upstream source(s) failed the scan"
            exit 1
          fi

  copy-and-sign:
    needs: scan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: signing
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      MIRROR_LIST: deployment/mirror.list.json
      COSIGN_VERSION: v3.1.3
      COSIGN_SHA256: 4629c757b7618056f8ddd7e2625ae9fdd94c0372a65049520bc7d9df9efc7f71
      CRANE_VERSION: v0.22.1
      CRANE_SHA256: 0ab7a1d6932a213aed964ce97666c3077fe691c8606413674a8b3e0b9ec4cda0
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install cosign and crane by checksum
        run: |
          curl -sSfL -o "$RUNNER_TEMP/cosign" \
            "https://github.com/sigstore/cosign/releases/download/$COSIGN_VERSION/cosign-linux-amd64"
          echo "$COSIGN_SHA256  $RUNNER_TEMP/cosign" | sha256sum -c -
          curl -sSfL -o "$RUNNER_TEMP/ggcr.tar.gz" \
            "https://github.com/google/go-containerregistry/releases/download/$CRANE_VERSION/go-containerregistry_Linux_x86_64.tar.gz"
          echo "$CRANE_SHA256  $RUNNER_TEMP/ggcr.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/ggcr.tar.gz" -C "$RUNNER_TEMP" crane
          install -m 0755 "$RUNNER_TEMP/cosign" "$RUNNER_TEMP/crane" /usr/local/bin/
      - name: Log in to GHCR
        run: echo "$GH_TOKEN" | crane auth login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      # The mirror keeps the source's digest: copy to that digest, read it back, then sign and lock exactly it.
      - name: Copy, sign and lock each source
        shell: bash
        run: |
          jq -r '.[] | [.source, .mirror] | @tsv' "$MIRROR_LIST" > "$RUNNER_TEMP/entries"
          test -s "$RUNNER_TEMP/entries"
          echo '{}' > "$RUNNER_TEMP/mirror.lock.json"
          while IFS=$'\t' read -r source mirror; do
            digest="${source##*@}"
            case "$digest" in sha256:????????????????????????????????????????????????????????????????) ;; *) exit 1 ;; esac
            crane copy "$source" "$mirror@$digest" < /dev/null
            test "$(crane digest "$mirror@$digest" < /dev/null)" = "$digest"
            cosign sign --yes "$mirror@$digest" < /dev/null
            name="${source%@*}"
            name="${name##*/}"
            jq --arg name "$name" --arg ref "$mirror@$digest" --arg source "$source" \
              '.[$name] = {ref: $ref, origin: "upstream", upstreamSource: $source, verify: "cosign-keyless"}' \
              "$RUNNER_TEMP/mirror.lock.json" > "$RUNNER_TEMP/lock.next"
            mv "$RUNNER_TEMP/lock.next" "$RUNNER_TEMP/mirror.lock.json"
            echo "- $mirror@$digest" >> "$GITHUB_STEP_SUMMARY"
          done < "$RUNNER_TEMP/entries"
      - name: Verify what was mirrored
        run: node scripts/ci/verify-images.ts "$RUNNER_TEMP/mirror.lock.json"
