# First-party container images (P1.27q). On every ready pull request and every push to main: hadolint, build, Trivy
# scan, SPDX SBOM, and the runtime checks (non-root, no dev dependencies, healthy). Nothing is pushed or signed yet:
# the push-and-sign job needs `packages: write` and the `signing` environment, which wait on Alex (see the P1.27q PR).
#
# Until P1.27 adds the Dockerfile the job prints a notice and passes; the skip is tied to exactly that file being
# absent (images_skip_only_without_dockerfile in scripts/ci/image-workflows.test.ts), so P1.27's own PR is the first
# one built here. Any later cost saving is change detection inside the job, never a `paths:` filter, because a
# required check that never starts blocks the PR.
#
# The `edge` job (P1.28q) does the same for the edge image, deployment/edge/Dockerfile (Caddy plus one plugin, P1.28):
# hadolint, build, Trivy and the image's own health check. It skips only while that file is absent, so P1.28's own PR
# is the first one built there. Its Trivy scan reads no ignore file: an edge finding is fixed, never accepted.
#
# Tool images are pinned by index digest (scripts/guards/workflows.ts). The image under test is referenced by the
# content id `docker build --iidfile` wrote, so it too is pinned by digest.
#
# P1.29w adds discover, scan-image and scan. discover runs scripts/ci/list-dockerfiles.ts and publishes one JSON
# object per Dockerfile under deployment/. scan-image builds and Trivy-scans each of them (fail-fast off). scan is
# the stable aggregate: it is green only when discover and scan-image both succeeded. The images and edge jobs stay,
# so hadolint, the SBOM and the health checks are unchanged. Values from the matrix reach run: only through env
# (scripts/guards/workflows.ts refuses an expression inside run:).
#
# P1.33s adds scan-export beside scan-image, for those same images. It creates a container without starting it,
# exports the filesystem, and runs trivy rootfs --scanners secret. P1.33u puts scan-export on scan's needs, so
# scan is green only when discover, scan-image and scan-export all succeeded. Making scan a required check
# stays P1.27r.

name: images

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions: {}

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  images:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      APP: web
      DOCKERFILE: deployment/images/node-app.Dockerfile
      HADOLINT_IMAGE: hadolint/hadolint:v2.15.1@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d
      TRIVY_IMAGE: aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa
      SYFT_IMAGE: anchore/syft:v1.54.0@sha256:0356562f495d432056237fbea5cbc2d4839c9c75cd500784a66de2e7cc95ca7c
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Skip until the Dockerfile exists
        id: dockerfile
        run: |
          if [ -e "$DOCKERFILE" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=images::skipped, no Dockerfile yet (lands in P1.27)"
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      # hadolint v2.15.1 README: `--config` file, non-zero exit at or above failure-threshold.
      - name: Lint the Dockerfile
        if: steps.dockerfile.outputs.present == 'true'
        run: docker run --rm -v "$PWD:/repo:ro" -w /repo "$HADOLINT_IMAGE" /bin/hadolint --config .github/hadolint.yaml "$DOCKERFILE"
      - name: Build
        if: steps.dockerfile.outputs.present == 'true'
        run: |
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export SOURCE_DATE_EPOCH
          docker buildx build --platform linux/amd64 --load --iidfile "$RUNNER_TEMP/iid" \
            --build-arg APP="$APP" --build-arg SOURCE_DATE_EPOCH -f "$DOCKERFILE" .
      # Vulnerability scan, Trivy 0.75.0 `image`: HIGH or CRITICAL with a fixed version fails (--ignore-unfixed); a DB
      # download failure or the timeout exits non-zero. --ignorefile /dev/null and no --skip-dirs or --skip-files, so
      # vulnerabilities are covered in every layer (P1.29v; Alex's card "Skip stripped files", 2026-10-07T18:56:42Z).
      # Secrets are not: inspect disables the secret analyzer on layers guessBaseLayers treats as the base
      # (pkg/fanal/artifact/image/image.go:401-405, tag v0.75.0). Those files are scan-export (P1.33s).
      - name: Scan
        if: steps.dockerfile.outputs.present == 'true'
        run: |
          APP_IMAGE="$(cat "$RUNNER_TEMP/iid")"
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/repo:ro" -w /repo "$TRIVY_IMAGE" \
            image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed --ignorefile /dev/null \
            --timeout 10m "$APP_IMAGE"
      - name: SBOM
        if: steps.dockerfile.outputs.present == 'true'
        run: |
          APP_IMAGE="$(cat "$RUNNER_TEMP/iid")"
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$SYFT_IMAGE" "docker:$APP_IMAGE" -o spdx-json > "$RUNNER_TEMP/sbom.spdx.json"
          test -s "$RUNNER_TEMP/sbom.spdx.json"
      - name: Runs as 65532
        if: steps.dockerfile.outputs.present == 'true'
        run: |
          APP_IMAGE="$(cat "$RUNNER_TEMP/iid")"
          test "$(docker run --rm --entrypoint id "$APP_IMAGE" -u)" = "65532"
      - name: Holds no dev dependencies
        if: steps.dockerfile.outputs.present == 'true'
        run: |
          APP_IMAGE="$(cat "$RUNNER_TEMP/iid")"
          docker run --rm --network none -v "$PWD/package.json:/check/package.json:ro" --entrypoint node "$APP_IMAGE" -e '
            const fs = require("node:fs");
            const dev = Object.keys(require("/check/package.json").devDependencies ?? {});
            const found = dev.filter((name) => fs.existsSync(`/app/node_modules/${name}`));
            if (found.length > 0) { console.error(`the image holds dev dependencies ${found.join(" ")}`); process.exit(1); }'
      # The image's own HEALTHCHECK (GET /health) must report healthy within 20 s, started with the app's test env.
      - name: Becomes healthy
        if: steps.dockerfile.outputs.present == 'true'
        run: |
          APP_IMAGE="$(cat "$RUNNER_TEMP/iid")"
          id="$(docker run -d --read-only --tmpfs /tmp --env-file "deployment/images/$APP.test.env" "$APP_IMAGE")"
          for _ in $(seq 20); do
            status="$(docker inspect --format '{{.State.Health.Status}}' "$id")"
            if [ "$status" = "healthy" ]; then docker rm -f "$id" > /dev/null; exit 0; fi
            sleep 1
          done
          docker logs "$id"
          docker rm -f "$id" > /dev/null
          echo "not healthy within 20 s (last status: $status)"
          exit 1

  edge:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      DOCKERFILE: deployment/edge/Dockerfile
      HADOLINT_IMAGE: hadolint/hadolint:v2.15.1@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d
      TRIVY_IMAGE: aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Skip until the edge Dockerfile exists
        id: dockerfile
        run: |
          if [ -e "$DOCKERFILE" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=edge::skipped, no edge Dockerfile yet (lands in P1.28)"
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Lint the Dockerfile
        if: steps.dockerfile.outputs.present == 'true'
        run: docker run --rm -v "$PWD:/repo:ro" -w /repo "$HADOLINT_IMAGE" /bin/hadolint --config .github/hadolint.yaml "$DOCKERFILE"
      - name: Build
        if: steps.dockerfile.outputs.present == 'true'
        run: |
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export SOURCE_DATE_EPOCH
          docker buildx build --platform linux/amd64 --load --iidfile "$RUNNER_TEMP/iid" \
            --build-arg SOURCE_DATE_EPOCH -f "$DOCKERFILE" deployment/edge
      # Trivy v0.75.0: HIGH or CRITICAL with a fixed version fails, and no accepted finding applies (--ignorefile
      # /dev/null, so neither .trivyignore nor .github/trivyignore.yaml is read); the gobinary analyser covers the
      # built Caddy binary.
      - name: Scan
        if: steps.dockerfile.outputs.present == 'true'
        run: |
          EDGE_IMAGE="$(cat "$RUNNER_TEMP/iid")"
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE" \
            image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed --ignorefile /dev/null \
            --timeout 10m "$EDGE_IMAGE"
      # The image's own HEALTHCHECK must report healthy within 20 s, on a read-only root with Caddy's data and config
      # directories on tmpfs, started with the edge's test env.
      - name: Becomes healthy
        if: steps.dockerfile.outputs.present == 'true'
        run: |
          EDGE_IMAGE="$(cat "$RUNNER_TEMP/iid")"
          ENV_FILE=deployment/edge/edge.test.env
          id="$(docker run -d --read-only --tmpfs /tmp --tmpfs /data --tmpfs /config --env-file "$ENV_FILE" "$EDGE_IMAGE")"
          for _ in $(seq 20); do
            status="$(docker inspect --format '{{.State.Health.Status}}' "$id")"
            if [ "$status" = "healthy" ]; then docker rm -f "$id" > /dev/null; exit 0; fi
            sleep 1
          done
          docker logs "$id"
          docker rm -f "$id" > /dev/null
          echo "not healthy within 20 s (last status: $status)"
          exit 1

  # P1.29w. One JSON object per Dockerfile, written to $GITHUB_OUTPUT by the script (GitHub Actions
  # workflow commands, "Setting an output parameter"). Job outputs are a map the next job reads through
  # needs (docs.github.com workflow-syntax, jobs.<job_id>.outputs). contents: read, no secrets.
  discover:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      images: ${{ steps.list.outputs.images }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - id: list
        run: node scripts/ci/list-dockerfiles.ts

  # Matrix include is the JSON array discover printed (workflow-syntax, jobs.<job_id>.strategy.matrix.include,
  # the include-only example; expressions fromJSON). fail-fast defaults to true and is off here so one image
  # does not hide another (workflow-syntax, jobs.<job_id>.strategy.fail-fast). The job name includes the image
  # name. A custom if without a status function still requires success(), so this job does not run when
  # discover failed (expressions, "Status check functions"). Dockerfile and ignore file reach the shell only
  # as env. A file named Dockerfile is built from its own directory (the edge image); a *.Dockerfile is built
  # from the repository root (node-app and migrate COPY the repo). Trivy v0.75.0 image:
  # --severity HIGH,CRITICAL, --ignore-unfixed, --ignorefile (default .trivyignore, so /dev/null reads no
  # ignore file), --exit-code, and --timeout from the parent command (default 5m; 10m matches the other jobs).
  # https://github.com/aquasecurity/trivy/blob/v0.75.0/docs/guide/references/configuration/cli/trivy_image.md
  scan-image:
    name: scan ${{ matrix.name }}
    needs: discover
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.images) }}
    env:
      TRIVY_IMAGE: aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        env:
          DOCKERFILE: ${{ matrix.dockerfile }}
        run: |
          case "$DOCKERFILE" in
            */Dockerfile) CONTEXT="${DOCKERFILE%/*}" ;;
            *) CONTEXT="." ;;
          esac
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export SOURCE_DATE_EPOCH
          docker buildx build --platform linux/amd64 --load --iidfile "$RUNNER_TEMP/iid" \
            --build-arg SOURCE_DATE_EPOCH -f "$DOCKERFILE" "$CONTEXT"
      - name: Scan
        env:
          IGNOREFILE: ${{ matrix.ignorefile }}
        run: |
          APP_IMAGE="$(cat "$RUNNER_TEMP/iid")"
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/repo:ro" -w /repo "$TRIVY_IMAGE" \
            image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed --ignorefile "$IGNOREFILE" \
            --timeout 10m "$APP_IMAGE"

  # P1.33s (Alex's typed line "yes P1.33s .github/workflows exported-filesystem secret scan in images.yml",
  # 2026-10-14). Trivy 0.75.0 skips secret analysis on layers guessBaseLayers treats as the base
  # (pkg/fanal/artifact/image/image.go:401-405). docker create does not start the container; docker export writes
  # the flattened filesystem, which `trivy rootfs` scans (docs/guide/references/configuration/cli/trivy_rootfs.md,
  # tag v0.75.0, the export example). --scanners secret leaves vulnerabilities to the image steps. --ignorefile
  # /dev/null, so no repo ignore file is read (trivy_rootfs.md, --ignorefile). No --skip-dirs or --skip-files.
  # --timeout 10m because the parent default is 5m0s. Same TRIVY_IMAGE pin. fail-fast is off, as in scan-image,
  # so one image cannot hide another. P1.33u (Alex's typed line "yes P1.33u .github/workflows/images.yml
  # .github/workflows/mirror.yml scripts/ci secret scan gate", 2026-10-14): an export with no files, or without
  # /etc/os-release or the ENTRYPOINT's first element, fails before Trivy, and "0 files scanned" is not green.
  # scan's needs are discover, scan-image and scan-export.
  scan-export:
    name: scan-export ${{ matrix.name }}
    needs: discover
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.images) }}
    env:
      TRIVY_IMAGE: aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        env:
          DOCKERFILE: ${{ matrix.dockerfile }}
        run: |
          case "$DOCKERFILE" in
            */Dockerfile) CONTEXT="${DOCKERFILE%/*}" ;;
            *) CONTEXT="." ;;
          esac
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export SOURCE_DATE_EPOCH
          docker buildx build --platform linux/amd64 --load --iidfile "$RUNNER_TEMP/iid" \
            --build-arg SOURCE_DATE_EPOCH -f "$DOCKERFILE" "$CONTEXT"
      # `bash -e` (Actions' default when shell is unset) does not enable pipefail, so the export sets it
      # (docs.github.com workflow syntax, "jobs.<job_id>.steps[*].shell"; mirror.yml's scan step).
      - name: Scan exported filesystem for secrets
        run: |
          set -o pipefail
          APP_IMAGE="$(cat "$RUNNER_TEMP/iid")"
          rootfs="$RUNNER_TEMP/rootfs"
          rm -rf "$rootfs"
          mkdir -p "$rootfs"
          cid="$(docker create "$APP_IMAGE")"
          status=0
          docker export "$cid" | tar -C "$rootfs" -xf - || status=$?
          docker rm "$cid" > /dev/null
          if [ "$status" -ne 0 ]; then
            echo "docker export failed"
            exit "$status"
          fi
          if [ -z "$(find "$rootfs" -type f -print -quit)" ]; then
            echo "export contains 0 files"
            exit 1
          fi
          if [ ! -f "$rootfs/etc/os-release" ]; then
            echo "export is missing /etc/os-release"
            exit 1
          fi
          # First ENTRYPOINT element (docs.docker.com/reference/cli/docker/inspect/, Go template).
          entrypoint=$(docker inspect --format '{{if .Config.Entrypoint}}{{index .Config.Entrypoint 0}}{{end}}' "$APP_IMAGE")
          case "$entrypoint" in
            /*) entryfile="$rootfs$entrypoint" ;;
            ?*) entryfile="$rootfs/$entrypoint" ;;
            *)
              echo "image has no ENTRYPOINT"
              exit 1
              ;;
          esac
          if [ ! -e "$entryfile" ]; then
            echo "export is missing the ENTRYPOINT target"
            exit 1
          fi
          # A report that scanned nothing is a failed scan even when Trivy exits 0.
          report="$RUNNER_TEMP/trivy-secret.txt"
          status=0
          docker run --rm -v "$rootfs:/rootfs:ro" "$TRIVY_IMAGE" \
            rootfs --scanners secret --exit-code 1 --ignorefile /dev/null --timeout 10m /rootfs \
            | tee "$report" || status=$?
          if [ "$status" -ne 0 ]; then
            echo "trivy rootfs failed"
            exit "$status"
          fi
          if grep -F -q "0 files scanned" "$report"; then
            echo "trivy scanned 0 files"
            exit 1
          fi

  # The one stable name (P1.27r requires `scan`, not the per-image names). always() runs this job when
  # discover, scan-image or scan-export failed, was skipped or was cancelled (workflow-syntax,
  # jobs.<job_id>.needs; expressions, always()). needs.<job_id>.result is success, failure, cancelled or
  # skipped (contexts reference). Anything but success is red, so a skipped export cannot read as green
  # (P1.33u). Drafts stay skipped, same as the other jobs. Making `scan` a required check stays P1.27r.
  scan:
    needs: [discover, scan-image, scan-export]
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Require discover and every image scan to have succeeded
        env:
          DISCOVER: ${{ needs.discover.result }}
          SCAN_RESULT: ${{ needs.scan-image.result }}
          EXPORT_RESULT: ${{ needs.scan-export.result }}
        run: |
          if [ "$DISCOVER" != success ] || [ "$SCAN_RESULT" != success ] || [ "$EXPORT_RESULT" != success ]; then
            echo "discover=$DISCOVER scan-image=$SCAN_RESULT scan-export=$EXPORT_RESULT"
            exit 1
          fi

  # P1.34m (record unset-plan/book-edits/2026-10-13-p134m-pr-scan-new-runtime-pins.md; Alex's card "Add a CI job",
  # 2026-10-13T04:02:36Z): a pull request that adds or changes a runtime base pin in deployment/images/bases.lock.json
  # gets that pin scanned before it merges, at the mirror's runtime severity and with its stripped skips. Only pins
  # that differ from the base branch's lock are scanned (scripts/ci/runtime-pins.ts), so an unchanged pin's standing
  # findings stay with mirror.yml. Each pin's times are printed: imagetools' `created` is the image config's build
  # time, a lower bound only; for a ghcr.io pin the push time is the GHCR package version's `created_at` (REST
  # "List package versions for a package owned by an organization", docs.github.com/en/rest/packages/packages,
  # apiVersion 2022-11-28). GitHub's pages disagree on whether GITHUB_TOKEN may read a public package another account
  # owns, so a 401, 403 or 404 is the fallback: an annotation asks Alex to paste the push time from the package page,
  # and the job stays red. The scan runs whenever the selection succeeded, so a failed lookup never hides a scan
  # result (scripts/ci/pins-job.test.ts runs these steps). Pull requests only: on main, mirror.yml scans every pin.
  pins:
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    env:
      BASES_LOCK: deployment/images/bases.lock.json
      TRIVY_IMAGE: aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Select the runtime pins this pull request adds or changes
        id: select
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          if git cat-file -e "$BASE_SHA:$BASES_LOCK" 2> /dev/null; then
            git show "$BASE_SHA:$BASES_LOCK" > "$RUNNER_TEMP/base.lock.json"
          fi
          node scripts/ci/runtime-pins.ts "$RUNNER_TEMP/base.lock.json" "$BASES_LOCK" > "$RUNNER_TEMP/pins.json"
          jq -r 'if length == 0 then "no runtime pin added or changed" else .[].source end' "$RUNNER_TEMP/pins.json"
      # Every pin is looked up, and each failure is named; the step fails after the last pin.
      - name: Print each pin's build and push time
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          failed=0
          while IFS= read -r source; do
            if ! docker buildx imagetools inspect --format '{{json .Image}}' "$source" > "$RUNNER_TEMP/image.json" < /dev/null; then
              echo "::error title=pins::imagetools could not read $source"
              failed=$((failed + 1))
              continue
            fi
            created="$(jq -r 'if has("created") then .created else ([.[] | .created] | join(" ")) end' \
              "$RUNNER_TEMP/image.json")"
            echo "$source: image config created $created (build time, a lower bound only)"
            case "$source" in ghcr.io/*) ;; *) echo "$source: not on ghcr.io, no push time looked up"; continue ;; esac
            image="${source#ghcr.io/}"; image="${image%%@*}"; image="${image%:*}"
            owner="${image%%/*}"; package="$(jq -rn --arg p "${image#*/}" '$p | @uri')"
            digest="${source#*@}"; pushed=""; found=""; status=""
            for kind in orgs users; do
              page=1
              while [ "$page" -le 50 ]; do
                # curl prints 000 when it reaches no server; that is a failed lookup, not an end to the step.
                status="$(curl -sS -o "$RUNNER_TEMP/versions.json" -w '%{http_code}' \
                  -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
                  -H "X-GitHub-Api-Version: 2022-11-28" \
                  "https://api.github.com/$kind/$owner/packages/container/$package/versions?per_page=100&page=$page")" || true
                if [ "$status" != 200 ]; then break; fi
                if ! jq -e 'type == "array"' "$RUNNER_TEMP/versions.json" > /dev/null 2>&1; then
                  status="200, not a version list"
                  break
                fi
                found="$kind"
                pushed="$(jq -r --arg d "$digest" '.[] | select(.name == $d) | .created_at' "$RUNNER_TEMP/versions.json")"
                if [ -n "$pushed" ] || [ "$(jq length "$RUNNER_TEMP/versions.json")" -lt 100 ]; then break; fi
                page=$((page + 1))
              done
              if [ -n "$found" ]; then break; fi
            done
            if [ -z "$found" ]; then
              case "$status" in
                401 | 403 | 404)
                  echo "::error title=pins::GHCR refused the push-time lookup for $source (HTTP $status). Alex: open https://github.com/orgs/$owner/packages/container/package/$package (a user's package: https://github.com/users/$owner/packages/container/package/$package), find version $digest and paste its published time into the PR" ;;
                *) echo "::error title=pins::GHCR lookup failed for $source (HTTP $status)" ;;
              esac
              failed=$((failed + 1))
              continue
            fi
            if [ -z "$pushed" ]; then
              echo "::error title=pins::no GHCR package version has $digest ($source)"
              failed=$((failed + 1))
              continue
            fi
            echo "$source: pushed to GHCR at $pushed"
          done < <(jq -r '.[].source' "$RUNNER_TEMP/pins.json")
          if [ "$failed" -gt 0 ]; then
            echo "$failed pin(s) without a build or push time"
            exit 1
          fi
      # The mirror's runtime rule (mirror.yml): HIGH or CRITICAL with a fixed version fails, with the accepted
      # findings file and the pin's stripped paths left out, each passed to both --skip-dirs and --skip-files. Gated
      # on the selection alone (docs.github.com, expressions, "Status check functions": an if without one implies
      # success()), so it runs after a failed lookup. Every pin is scanned, each failure is named, and the step
      # fails after the last pin.
      - name: Scan each pin
        if: ${{ !cancelled() && steps.select.outcome == 'success' }}
        shell: bash
        run: |
          cache="$RUNNER_TEMP/trivy-cache"
          mkdir -p "$cache"
          failed=0
          while IFS= read -r pin; do
            source="$(jq -r .source <<< "$pin")"
            skip=()
            while IFS= read -r path; do
              if [ -n "$path" ]; then skip+=(--skip-dirs "$path" --skip-files "$path"); fi
            done <<< "$(jq -r '.stripped[]' <<< "$pin")"
            status=0
            docker run --rm -v "$PWD:/repo:ro" -v "$cache:/root/.cache/trivy" -w /repo "$TRIVY_IMAGE" \
              image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed --ignorefile .github/trivyignore.yaml \
              --timeout 10m "${skip[@]}" "$source" < /dev/null || status=$?
            if [ "$status" -ne 0 ]; then
              echo "::error title=pins::scan failed (exit $status) for $source"
              failed=$((failed + 1))
            fi
          done < <(jq -c '.[]' "$RUNNER_TEMP/pins.json")
          if [ "$failed" -gt 0 ]; then
            echo "$failed pin(s) failed the scan"
            exit 1
          fi
