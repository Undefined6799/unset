# The human docs, copied to the docs repository (P1.21t; ADR 0111). On a push to main that changes docs/human,
# docs/site or the docs repository's own files, this builds this repository's part of github.com/unset-sh/docs
# (scripts/ci/docs-export.ts: the folder `unset/`, README.md and the Pages workflow) and pushes it as one commit that
# links its source. Every source repository owns one folder there, named after it, and replaces only that;
# docs.unset.sh is built from the whole. Nothing is ever read back from the docs repository into this one.
#
# The push uses a deploy key: an SSH key whose public half is on unset-sh/docs with write access and opens that one
# repository only (github/docs content/authentication/connecting-to-github-with-ssh/managing-deploy-keys.md, read
# 2026-11-21). Its private half is the secret DOCS_DEPLOY_KEY of the `docs-mirror` environment, which only main may
# deploy to, so a workflow on any other branch cannot read it. actions/checkout v7.0.1 takes the key as `ssh-key`,
# checks github.com's host key (`ssh-strict`, default true), checks out the default branch as a local branch
# (src/git-source-provider.ts:156-157, src/ref-helper.ts getCheckoutInfo at 3d3c42e), keeps the key for the job's own
# git commands and removes it in its post-job step (action.yml). The job installs no package and runs no third-party
# action.

name: docs-mirror

# A run starts only for a change to something the copy is built from, or to this file
# (scripts/ci/docs-mirror.test.ts, runs_only_for_a_push_to_main_that_changes_what_it_copies).
on:
  push:
    branches: [main]
    paths:
      - docs/human/**
      - docs/site/**
      - deployment/docs-repo/**
      - scripts/ci/docs-export.ts
      - .github/workflows/docs-mirror.yml

permissions: {}

# One copy at a time, in order, and a running push is never cut short.
concurrency:
  group: docs-mirror
  cancel-in-progress: false

jobs:
  mirror:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: docs-mirror
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Build this repository's part of the docs repository
        run: node scripts/ci/docs-export.ts "$RUNNER_TEMP/tree"
      - name: Check out the docs repository with its deploy key
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: unset-sh/docs
          ssh-key: ${{ secrets.DOCS_DEPLOY_KEY }}
          path: docs-repo
      # Only `unset`, README.md and `.github` are removed and staged, so a page deleted here is deleted there and
      # another source's folder is never touched, whatever the tree holds. The commit names its source commit. A
      # deploy key is an SSH key and carries no token scope, so it may push a workflow file (unverified until the
      # first run).
      - name: Replace this repository's part and push one commit
        shell: bash
        run: |
          cd docs-repo
          git rm -r --quiet --ignore-unmatch -- unset README.md .github
          cp -R "$RUNNER_TEMP/tree/." .
          git add --all -- unset README.md .github
          if git diff --cached --quiet; then
            echo "The docs repository already holds these docs." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          {
            echo "Copy the docs from ${GITHUB_REPOSITORY}@${GITHUB_SHA:0:7}"
            echo
            echo "Source: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$GITHUB_SHA"
          } | git commit --quiet --file=-
          # Another source repository may have pushed since the checkout. Its commit holds only its own folder, so
          # ours is replayed on top of it and sent again. A replay that does not apply cleanly stops the run here
          # (`-e`): someone wrote into this repository's part by hand, and the run must not pick a winner.
          branch="$(git symbolic-ref --short HEAD)"
          for attempt in 1 2 3; do
            if git push --quiet origin HEAD; then
              echo "Pushed $(git rev-parse HEAD) to the docs repository (attempt $attempt)." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            git pull --quiet --rebase origin "$branch"
          done
          echo "::error title=docs-mirror::the docs repository refused the push three times"
          exit 1
