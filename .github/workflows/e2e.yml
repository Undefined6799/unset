# Accessibility and browser harness (P1.26). Drafts run nothing; marking the PR ready runs it.
# pa11y-ci 5.0.0 and @lhci/cli 0.15.1 are installed here, not in the lockfile: their trees fail
# npm audit --audit-level=high. Lighthouse upload is filesystem only (lighthouserc.json).
# The browser jobs take their browsers from Playwright's image (P0.07n); a11y downloads Chromium itself.
#
# P0.07b: the suite runs as parallel jobs, one per Playwright project and one for pa11y and Lighthouse, so the
# critical path is the slowest part rather than their sum. Each job starts its own servers on its own runner, so each
# keeps its own rate-limit bucket and the one worker tests/e2e/playwright.config.ts asks for. `--project` and
# `install [browser...]` are from the CLI help of the pinned Playwright 1.64.0 (npx playwright test --help, npx
# playwright install --help). The e2e job is the gate: it fails unless every part succeeded, then runs assert-tests-ran
# over the three reports, so a spec no browser ran, or a missing, duplicated or empty browser report, still fails.
#
# P0.07f: `playwright install --with-deps` hung until the 30-minute job timeout in 3 of about 20 runs on 2026-10-22
# (WebKit; it usually takes under a minute). Each attempt is cut at 4 minutes by coreutils timeout (Ubuntu 24.04,
# `timeout --kill-after`), tried once more, and the step is capped at 9 minutes (workflow syntax,
# jobs.<job_id>.steps[*].timeout-minutes), so a stall costs minutes, not the run. A blocked download still fails.
# P0.07g: the job log named the stall: azure.archive.ubuntu.com served the `--with-deps` packages at a crawl, and the
# P0.07f retry then failed at once on "Could not get lock /var/lib/dpkg/lock-frontend", held by the first attempt's
# apt-get, which runs under sudo and outlived the timeout. So apt drops a stalled connection after 20 s and retries a
# file 3 times (apt-transport-http(1) Acquire::http::Timeout, apt.conf(5) Acquire::Retries, Ubuntu noble), and before
# the second attempt the orphaned apt-get is killed and waited out (pkill only signals), any dpkg it started is
# waited for, and dpkg is left configured. SIGKILL cannot be ignored; if it lands mid-install, dpkg keeps running
# and `dpkg --configure -a` finishes what it began.
# P0.07h: the mirror still crawled (about 50 KB/s on 2026-10-22, both 4-minute attempts cut), so the browser and the
# .deb files apt fetched for it are cached (actions/cache v6.1.0, action.yml and README at that tag). The browser's key
# names the Playwright version and the browser. The default branch's entries are readable from every PR; a PR's own
# entries only from that PR (README, "Cache scopes"). A hit skips the browser download. apt installs whatever file sits in /var/cache/apt/archives under
# the expected name and size without checking its hash (tried on Ubuntu 24.04: a flipped byte reached dpkg), so a cached
# package is handed over only when its SHA256 equals the one in the signed index for that name, architecture and
# version, and under the name apt looks for, built from those fields (NAME_VERSION_ARCH.deb, the version's ":" as
# "%3a", as apt names fonts-beng_2%3a1.3_all.deb), so a signed package cannot stand in under another package's name.
# Anything else is fetched from the mirror. apt.conf(5) APT::Keep-Downloaded-Packages keeps what it fetched.
# The index refresh before the hand-over is bounded like the install (Codex on #1292): apt's own timeouts, and
# coreutils timeout run as root so the kill reaches apt-get itself rather than sudo; a refresh that fails or is cut
# leaves an empty or old index, so nothing is handed over. A failed restore is a miss, so the worst case is today's
# mirror path.
# P0.07m: the WebKit install still timed out on 2026-11-18 (run 44343503120): the apt cache was keyed by runner image,
# and that run's runner (image 20261116.133.1, us-east-2.ec2 mirror) had no entry, while main's (20261111.370.1) did:
# GitHub runs several images at once. The miss fetched 125 MB at a crawl, and a failed install saved nothing, so every
# run on that image started cold. The apt packages now have their own cache: restore takes the newest entry whose key
# starts with the browser's prefix (actions/cache restore/README.md at v6.1.0; docs.github.com dependency-caching,
# "Matching a cache key": the most recently created partial match wins), and after the install, even a failed one, the
# packages apt holds are added to the set, versions they replace are dropped, and the set is saved
# (actions/cache/save) under a key naming its contents when that differs from the one restored. What one slow run
# fetched is kept for the next, and a set from any image is safe to restore, since the hand-over above checks every
# file against this runner's signed index.
# P0.07n: it was not enough. On 2026-11-18 the us-east-2 mirror served 20 to 60 kB/s and the WebKit and Firefox jobs
# still hit the install timeout with a partly filled cache (#1714, #1716, #1718). The browser jobs now install nothing:
# they start Playwright's own image (mcr.microsoft.com/playwright, v<version>-noble, browsers and system libraries
# built in; playwright.dev/docs/docker) pinned by index digest, run its browser server from the lockfile's
# playwright-core mounted read-only (no npx download), on the runner's network so the browsers reach the CONNECT proxy
# on 127.0.0.1, and point the tests at it with PW_TEST_CONNECT_WS_ENDPOINT (node_modules/playwright/lib/index.js,
# connectOptionsFromEnv, 1.64.1). The start step refuses an image whose version is not the lockfile's, and Renovate
# moves both in one "playwright" group. The steps below that install and cache now serve a11y only: pa11y and
# Lighthouse need Chromium on the runner.
# P0.07q: the browser legs had grown to 18 to 29 minutes of tests (WebKit the slowest) against their 30-minute limit,
# so one failing test, and the worker restart and write-pacer wait after it, ran WebKit into the limit, and a job cut
# at its limit prints no failure. Each browser now runs as E2E_SHARDS shards (`--shard`, playwright.dev/docs/test-sharding,
# Playwright 1.64.1). Every shard is its own job on its own runner with its own servers, Postgres and rate-limit buckets,
# so shards share no state and the write pacer in tests/e2e/cards.ts still sees every write of its member. The config
# writes a blob report on CI and ends the run at its globalTimeout, before the job limit, so a stuck run prints its
# failures and still uploads its reports. The gate merges each browser's shards into one JSON report with
# `playwright merge-reports` (same guide, "Merge reports CLI") and fails if a shard's blob is missing, so
# assert-tests-ran still sees one complete report per browser. The gate keeps the required name `e2e`.

name: e2e

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions: {}

# The shards each browser is split into (P0.07q). browser.strategy.matrix.shard lists 1 to this number.
env:
  E2E_SHARDS: "2"

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  browser:
    name: browser ${{ matrix.project }} shard ${{ matrix.shard }}
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    # fail-fast off, so one browser does not hide another (workflow-syntax, jobs.<job_id>.strategy.fail-fast).
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit]
        shard: [1, 2]
    env:
      PROJECT: ${{ matrix.project }}
      SHARD: ${{ matrix.shard }}
      # Playwright's own image at the lockfile's Playwright version (playwright.dev/docs/docker, v1.64.1-noble), pinned
      # by its index digest; the start step refuses a tag whose version differs from node_modules/playwright-core.
      PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
      BROWSER_PORT: "8445"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      # P0.07n: the browsers and their system libraries come prebuilt in Playwright's own image, at the version the
      # lockfile pins; the tests connect to it, so this job installs nothing from the Ubuntu mirror.
      # Nobody re-runs a failed job by hand: a pull that fails or stalls past 5 minutes is tried again here, up to three
      # times; docker keeps the layers a cut attempt finished, so each retry resumes rather than starts over.
      - name: Pull Playwright's image, up to three attempts (P0.07n)
        timeout-minutes: 17
        run: |
          for n in 1 2 3; do
            if timeout --kill-after=10s 300s docker pull --quiet "$PLAYWRIGHT_IMAGE"; then exit 0; fi
            echo "::warning::Image pull attempt $n of 3 failed or stalled"
            sleep $((n * 10))
          done
          exit 1
      - name: Start the browser server from Playwright's image (P0.07n)
        timeout-minutes: 8
        run: |
          test "$(node -p 'require("playwright-core/package.json").version')" = "$(echo "$PLAYWRIGHT_IMAGE" | sed -n 's/^[^:]*:v\([0-9.]*\)-.*/\1/p')"
          docker run --detach --name browsers --init --ipc=host --network host --user pwuser --volume "$PWD/node_modules:/opt/pw/node_modules:ro" "$PLAYWRIGHT_IMAGE" node /opt/pw/node_modules/playwright-core/cli.js run-server --port "$BROWSER_PORT" --host 127.0.0.1
          for _ in $(seq 60); do
            if (: > "/dev/tcp/127.0.0.1/$BROWSER_PORT") 2> /dev/null; then exit 0; fi
            sleep 2
          done
          docker logs browsers
          exit 1
      - name: Run Playwright
        run: |
          node tests/e2e/fixtures/servers.ts prod > e2e-prod.log 2>&1 &
          prod_pid=$!
          node tests/e2e/fixtures/servers.ts test > e2e-test.log 2>&1 &
          test_pid=$!
          cleanup() {
            kill "$prod_pid" "$test_pid" || true
          }
          trap cleanup EXIT
          node tests/e2e/fixtures/servers.ts wait
          PW_TEST_CONNECT_WS_ENDPOINT="ws://127.0.0.1:$BROWSER_PORT/" npx playwright test --config tests/e2e/playwright.config.ts --project "$PROJECT" --shard "$SHARD/$E2E_SHARDS"
      - name: Keep the browser server's log (P0.07n)
        if: ${{ !cancelled() }}
        run: docker logs browsers > e2e-browsers.log 2>&1 || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: e2e-${{ matrix.project }}-${{ matrix.shard }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            tests/e2e/report.json
            blob-report/
            playwright-report/
            e2e-prod.log
            e2e-test.log
            e2e-browsers.log

  a11y:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Name the browser cache (P0.07h)
        id: cache-name
        run: echo "playwright=$(node -p 'require("playwright-core/package.json").version')" >> "$GITHUB_OUTPUT"
      - name: Restore the browser (P0.07h)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: e2e-${{ runner.os }}-playwright-${{ steps.cache-name.outputs.playwright }}-chromium
      - name: Restore the newest apt packages kept for this browser (P0.07m)
        id: apt-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-archives
          key: e2e-apt-${{ runner.os }}-chromium-
      - name: Hand apt the cached packages that match its signed index (P0.07h)
        timeout-minutes: 3
        run: |
          sudo timeout --kill-after=10s 120s apt-get update -q -o Acquire::http::Timeout=20 -o Acquire::Retries=3 > /dev/null || true
          for deb in "$HOME"/apt-archives/*.deb; do
            [ -f "$deb" ] || continue
            name=$(dpkg-deb -f "$deb" Package) || continue
            arch=$(dpkg-deb -f "$deb" Architecture) || continue
            version=$(dpkg-deb -f "$deb" Version) || continue
            want=$(apt-cache show "$name:$arch=$version" 2> /dev/null | sed -n 's/^SHA256: //p' | head -n 1)
            have=$(sha256sum < "$deb" | cut -d ' ' -f 1)
            if [ -n "$want" ] && [ "$have" = "$want" ]; then
              sudo cp "$deb" "/var/cache/apt/archives/${name}_${version//:/%3a}_${arch}.deb"
            fi
          done
      - name: Install the browser, once more if the first attempt stalls (P0.07f, P0.07g)
        timeout-minutes: 9
        run: |
          printf 'Acquire::http::Timeout "20";\nAcquire::Retries "3";\nAPT::Keep-Downloaded-Packages "true";\n' | sudo tee /etc/apt/apt.conf.d/80-e2e-install > /dev/null
          attempt() { timeout --kill-after=10s 240s npx playwright install --with-deps chromium; }
          attempt || {
            sudo pkill -KILL -x apt-get || true
            while pgrep -x apt-get > /dev/null || pgrep -x dpkg > /dev/null; do sleep 2; done
            sudo dpkg --configure -a
            attempt
          }
      - name: Add the packages apt has now to the kept set, even after a failed install (P0.07m)
        id: apt-keep
        if: ${{ !cancelled() }}
        env:
          PREFIX: ${{ steps.apt-cache.outputs.cache-primary-key }}
        run: |
          kept="$HOME/apt-archives"
          mkdir -p "$kept"
          for deb in "$kept"/*.deb; do
            file=${deb##*/}
            [ -f "$deb" ] && [ ! -e "/var/cache/apt/archives/$file" ] || continue
            if compgen -G "/var/cache/apt/archives/${file%%_*}_*_${file##*_}" > /dev/null; then rm "$deb"; fi
          done
          find /var/cache/apt/archives -maxdepth 1 -name '*.deb' -exec cp -t "$kept" {} +
          if [ -n "$PREFIX" ] && compgen -G "$kept/*.deb" > /dev/null; then
            echo "key=$PREFIX$(cd "$kept" && LC_ALL=C && sha256sum -- *.deb | sha256sum | cut -c 1-16)" >> "$GITHUB_OUTPUT"
          fi
      - name: Save the kept set if it changed (P0.07m)
        if: ${{ !cancelled() && steps.apt-keep.outputs.key != '' && steps.apt-keep.outputs.key != steps.apt-cache.outputs.cache-matched-key }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-archives
          key: ${{ steps.apt-keep.outputs.key }}
      - name: Install pa11y and Lighthouse outside the lockfile
        run: npm install --ignore-scripts --prefix /tmp/a11y-tools pa11y-ci@5.0.0 @lhci/cli@0.15.1
      - name: Point pa11y and Lighthouse at Playwright's Chromium
        run: node tests/e2e/fixtures/chrome-path.ts
      - name: Run pa11y and Lighthouse
        run: |
          export PATH="/tmp/a11y-tools/node_modules/.bin:$PATH"
          node tests/e2e/fixtures/servers.ts prod > e2e-prod.log 2>&1 &
          prod_pid=$!
          node tests/e2e/fixtures/servers.ts test > e2e-test.log 2>&1 &
          test_pid=$!
          cleanup() {
            kill "$prod_pid" "$test_pid" || true
          }
          trap cleanup EXIT
          node tests/e2e/fixtures/servers.ts wait
          pa11y-ci --config .pa11yci.json > pa11y-results.json
          lhci autorun --config ./lighthouserc.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: e2e-a11y
          retention-days: 14
          if-no-files-found: warn
          path: |
            .lighthouseci/
            pa11y-results.json
            e2e-prod.log
            e2e-test.log

  # The gate under the required name `e2e`. always() runs it whatever the parts did (expressions, "Status check
  # functions"), so a failed, cancelled or skipped part turns it red: without always() it would be skipped, and a
  # skipped required check reads as passing. needs.<job_id>.result is success, failure, cancelled or skipped
  # (contexts reference); anything but success fails, as in images.yml's scan gate. download-artifact v8.0.2 puts
  # each matched artifact in a folder named after it under path when merge-multiple is false, its default
  # (action.yml and README.md at that tag). Each browser's shards are merged into one report (P0.07q), and
  # assert-tests-ran then wants exactly one report per project.
  e2e:
    needs: [browser, a11y]
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Require every browser job and a11y to have succeeded
        env:
          BROWSER_RESULT: ${{ needs.browser.result }}
          A11Y_RESULT: ${{ needs.a11y.result }}
        run: |
          if [ "$BROWSER_RESULT" != success ] || [ "$A11Y_RESULT" != success ]; then
            echo "browser=$BROWSER_RESULT a11y=$A11Y_RESULT"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: e2e-*
          path: ${{ runner.temp }}/e2e
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      # Each shard must have left exactly one blob, or the step fails, so a missing shard cannot shrink a browser's
      # report. Its name is taken as found: with --project it is report-<project>-<shard>.zip (playwright 1.64.1
      # lib/runner/index.js computeCommandHash and _defaultReportName; Codex on #2031). PLAYWRIGHT_JSON_OUTPUT_FILE
      # names the JSON reporter's file (same file, resolveOutputFile).
      - name: Merge each browser's shard reports into one (P0.07q)
        env:
          REPORTS: ${{ runner.temp }}/e2e
        run: |
          for project in chromium firefox webkit; do
            mkdir -p "$REPORTS/$project-blobs"
            for shard in $(seq "$E2E_SHARDS"); do
              blobs=("$REPORTS/e2e-$project-$shard"/blob-report/*.zip)
              if [ "${#blobs[@]}" -ne 1 ] || [ ! -f "${blobs[0]}" ]; then
                echo "::error::$project shard $shard left ${#blobs[@]} blob reports, not one"
                exit 1
              fi
              cp "${blobs[0]}" "$REPORTS/$project-blobs/"
            done
            PLAYWRIGHT_JSON_OUTPUT_FILE="$REPORTS/$project.json" npx playwright merge-reports --reporter json "$REPORTS/$project-blobs"
          done
      - name: Every discovered spec ran in some browser, each browser exactly once
        env:
          REPORTS: ${{ runner.temp }}/e2e
        run: >-
          node scripts/test/assert-tests-ran.ts
          "chromium=$REPORTS/chromium.json"
          "firefox=$REPORTS/firefox.json"
          "webkit=$REPORTS/webkit.json"
