# Accessibility and browser harness (P1.26). Drafts run nothing; marking the PR ready runs it.
# pa11y-ci 5.0.0 and @lhci/cli 0.15.1 are installed here, not in the lockfile: their trees fail
# npm audit --audit-level=high. Lighthouse upload is filesystem only (lighthouserc.json).
# Browser download is this job; a blocked download fails it.

name: e2e

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions: {}

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Build the web app
        run: npm run build -w @unset/apps-web
      - name: Install pa11y and Lighthouse outside the lockfile
        run: npm install --ignore-scripts --prefix /tmp/a11y-tools pa11y-ci@5.0.0 @lhci/cli@0.15.1
      - name: Point pa11y and Lighthouse at Playwright's Chromium
        run: node tests/e2e/fixtures/chrome-path.ts
      - name: Run Playwright, pa11y and Lighthouse
        run: |
          export PATH="/tmp/a11y-tools/node_modules/.bin:$PATH"
          node tests/e2e/fixtures/servers.ts prod > e2e-prod.log 2>&1 &
          prod_pid=$!
          node tests/e2e/fixtures/servers.ts test > e2e-test.log 2>&1 &
          test_pid=$!
          cleanup() {
            kill "$prod_pid" "$test_pid" || true
          }
          trap cleanup EXIT
          node tests/e2e/fixtures/servers.ts wait
          npx playwright test --config tests/e2e/playwright.config.ts
          node scripts/test/assert-tests-ran.ts tests/e2e/report.json
          pa11y-ci --config .pa11yci.json > pa11y-results.json
          lhci autorun --config ./lighthouserc.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: e2e-reports
          retention-days: 14
          if-no-files-found: warn
          path: |
            tests/e2e/report.json
            playwright-report/
            .lighthouseci/
            pa11y-results.json
            e2e-prod.log
            e2e-test.log
