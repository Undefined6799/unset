# Accessibility and browser harness (P1.26). Drafts run nothing; marking the PR ready runs it.
# pa11y-ci 5.0.0 and @lhci/cli 0.15.1 are installed here, not in the lockfile: their trees fail
# npm audit --audit-level=high. Lighthouse upload is filesystem only (lighthouserc.json).
# Browser download is each job's own; a blocked download fails it.
#
# P0.07b: the suite runs as parallel jobs, one per Playwright project and one for pa11y and Lighthouse, so the
# critical path is the slowest part rather than their sum. Each job starts its own servers on its own runner, so each
# keeps its own rate-limit bucket and the one worker tests/e2e/playwright.config.ts asks for. `--project` and
# `install [browser...]` are from the CLI help of the pinned Playwright 1.64.0 (npx playwright test --help, npx
# playwright install --help). The e2e job is the gate: it fails unless every part succeeded, then runs assert-tests-ran
# over the three reports, so a spec no browser ran, or a missing, duplicated or empty browser report, still fails.
#
# P0.07f: `playwright install --with-deps` hung until the 30-minute job timeout in 3 of about 20 runs on 2026-10-22
# (WebKit; it usually takes under a minute). Each attempt is cut at 4 minutes by coreutils timeout (Ubuntu 24.04,
# `timeout --kill-after`), tried once more, and the step is capped at 9 minutes (workflow syntax,
# jobs.<job_id>.steps[*].timeout-minutes), so a stall costs minutes, not the run. A blocked download still fails.
# P0.07g: the job log named the stall: azure.archive.ubuntu.com served the `--with-deps` packages at a crawl, and the
# P0.07f retry then failed at once on "Could not get lock /var/lib/dpkg/lock-frontend", held by the first attempt's
# apt-get, which runs under sudo and outlived the timeout. So apt drops a stalled connection after 20 s and retries a
# file 3 times (apt-transport-http(1) Acquire::http::Timeout, apt.conf(5) Acquire::Retries, Ubuntu noble), and before
# the second attempt the orphaned apt-get is killed and waited out (pkill only signals), any dpkg it started is
# waited for, and dpkg is left configured. SIGKILL cannot be ignored; if it lands mid-install, dpkg keeps running
# and `dpkg --configure -a` finishes what it began.
# P0.07h: the mirror still crawled (about 50 KB/s on 2026-10-22, both 4-minute attempts cut), so the browser and the
# .deb files apt fetched for it are cached (actions/cache v6.1.0, action.yml and README at that tag). The key names the
# runner image (its ImageVersion variable), the Playwright version and the browser, so a new image or Playwright starts a
# fresh entry. The default branch's entries are readable from every PR; a PR's own entries only from that PR (README,
# "Cache scopes"). A hit skips the browser download. apt installs whatever file sits in /var/cache/apt/archives under
# the expected name and size without checking its hash (tried on Ubuntu 24.04: a flipped byte reached dpkg), so a cached
# package is handed over only when its SHA256 equals the one in the signed index for that name, architecture and
# version, and under the name apt looks for, built from those fields (NAME_VERSION_ARCH.deb, the version's ":" as
# "%3a", as apt names fonts-beng_2%3a1.3_all.deb), so a signed package cannot stand in under another package's name.
# Anything else is fetched from the mirror. apt.conf(5) APT::Keep-Downloaded-Packages keeps what it fetched.
# A failed restore is a miss, so the worst case is today's mirror path.

name: e2e

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions: {}

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  browser:
    name: browser ${{ matrix.project }}
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    # fail-fast off, so one browser does not hide another (workflow-syntax, jobs.<job_id>.strategy.fail-fast).
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit]
    env:
      PROJECT: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Name the browser cache (P0.07h)
        id: cache-name
        run: |
          echo "playwright=$(node -p 'require("playwright-core/package.json").version')" >> "$GITHUB_OUTPUT"
          echo "image=${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"
      - name: Restore the browser and its apt packages (P0.07h)
        id: browser-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/ms-playwright
            ~/apt-archives
          key: e2e-${{ runner.os }}-${{ steps.cache-name.outputs.image }}-playwright-${{ steps.cache-name.outputs.playwright }}-${{ env.PROJECT }}
      - name: Hand apt the cached packages that match its signed index (P0.07h)
        run: |
          sudo apt-get update -q > /dev/null || true
          for deb in "$HOME"/apt-archives/*.deb; do
            [ -f "$deb" ] || continue
            name=$(dpkg-deb -f "$deb" Package) || continue
            arch=$(dpkg-deb -f "$deb" Architecture) || continue
            version=$(dpkg-deb -f "$deb" Version) || continue
            want=$(apt-cache show "$name:$arch=$version" 2> /dev/null | sed -n 's/^SHA256: //p' | head -n 1)
            have=$(sha256sum < "$deb" | cut -d ' ' -f 1)
            if [ -n "$want" ] && [ "$have" = "$want" ]; then
              sudo cp "$deb" "/var/cache/apt/archives/${name}_${version//:/%3a}_${arch}.deb"
            fi
          done
      - name: Install the browser, once more if the first attempt stalls (P0.07f, P0.07g)
        timeout-minutes: 9
        run: |
          printf 'Acquire::http::Timeout "20";\nAcquire::Retries "3";\nAPT::Keep-Downloaded-Packages "true";\n' | sudo tee /etc/apt/apt.conf.d/80-e2e-install > /dev/null
          attempt() { timeout --kill-after=10s 240s npx playwright install --with-deps "$PROJECT"; }
          attempt || {
            sudo pkill -KILL -x apt-get || true
            while pgrep -x apt-get > /dev/null || pgrep -x dpkg > /dev/null; do sleep 2; done
            sudo dpkg --configure -a
            attempt
          }
      - name: Keep the packages apt fetched, for the cache (P0.07h)
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$HOME/apt-archives"
          find /var/cache/apt/archives -maxdepth 1 -name '*.deb' -exec cp -t "$HOME/apt-archives" {} +
      - name: Build the web app
        run: npm run build -w @unset/apps-web
      - name: Run Playwright
        run: |
          node tests/e2e/fixtures/servers.ts prod > e2e-prod.log 2>&1 &
          prod_pid=$!
          node tests/e2e/fixtures/servers.ts test > e2e-test.log 2>&1 &
          test_pid=$!
          cleanup() {
            kill "$prod_pid" "$test_pid" || true
          }
          trap cleanup EXIT
          node tests/e2e/fixtures/servers.ts wait
          npx playwright test --config tests/e2e/playwright.config.ts --project "$PROJECT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: e2e-${{ matrix.project }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            tests/e2e/report.json
            playwright-report/
            e2e-prod.log
            e2e-test.log

  a11y:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Name the browser cache (P0.07h)
        id: cache-name
        run: |
          echo "playwright=$(node -p 'require("playwright-core/package.json").version')" >> "$GITHUB_OUTPUT"
          echo "image=${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"
      - name: Restore the browser and its apt packages (P0.07h)
        id: browser-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/ms-playwright
            ~/apt-archives
          key: e2e-${{ runner.os }}-${{ steps.cache-name.outputs.image }}-playwright-${{ steps.cache-name.outputs.playwright }}-chromium
      - name: Hand apt the cached packages that match its signed index (P0.07h)
        run: |
          sudo apt-get update -q > /dev/null || true
          for deb in "$HOME"/apt-archives/*.deb; do
            [ -f "$deb" ] || continue
            name=$(dpkg-deb -f "$deb" Package) || continue
            arch=$(dpkg-deb -f "$deb" Architecture) || continue
            version=$(dpkg-deb -f "$deb" Version) || continue
            want=$(apt-cache show "$name:$arch=$version" 2> /dev/null | sed -n 's/^SHA256: //p' | head -n 1)
            have=$(sha256sum < "$deb" | cut -d ' ' -f 1)
            if [ -n "$want" ] && [ "$have" = "$want" ]; then
              sudo cp "$deb" "/var/cache/apt/archives/${name}_${version//:/%3a}_${arch}.deb"
            fi
          done
      - name: Install the browser, once more if the first attempt stalls (P0.07f, P0.07g)
        timeout-minutes: 9
        run: |
          printf 'Acquire::http::Timeout "20";\nAcquire::Retries "3";\nAPT::Keep-Downloaded-Packages "true";\n' | sudo tee /etc/apt/apt.conf.d/80-e2e-install > /dev/null
          attempt() { timeout --kill-after=10s 240s npx playwright install --with-deps chromium; }
          attempt || {
            sudo pkill -KILL -x apt-get || true
            while pgrep -x apt-get > /dev/null || pgrep -x dpkg > /dev/null; do sleep 2; done
            sudo dpkg --configure -a
            attempt
          }
      - name: Keep the packages apt fetched, for the cache (P0.07h)
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$HOME/apt-archives"
          find /var/cache/apt/archives -maxdepth 1 -name '*.deb' -exec cp -t "$HOME/apt-archives" {} +
      - name: Build the web app
        run: npm run build -w @unset/apps-web
      - name: Install pa11y and Lighthouse outside the lockfile
        run: npm install --ignore-scripts --prefix /tmp/a11y-tools pa11y-ci@5.0.0 @lhci/cli@0.15.1
      - name: Point pa11y and Lighthouse at Playwright's Chromium
        run: node tests/e2e/fixtures/chrome-path.ts
      - name: Run pa11y and Lighthouse
        run: |
          export PATH="/tmp/a11y-tools/node_modules/.bin:$PATH"
          node tests/e2e/fixtures/servers.ts prod > e2e-prod.log 2>&1 &
          prod_pid=$!
          node tests/e2e/fixtures/servers.ts test > e2e-test.log 2>&1 &
          test_pid=$!
          cleanup() {
            kill "$prod_pid" "$test_pid" || true
          }
          trap cleanup EXIT
          node tests/e2e/fixtures/servers.ts wait
          pa11y-ci --config .pa11yci.json > pa11y-results.json
          lhci autorun --config ./lighthouserc.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: e2e-a11y
          retention-days: 14
          if-no-files-found: warn
          path: |
            .lighthouseci/
            pa11y-results.json
            e2e-prod.log
            e2e-test.log

  # The gate under the required name `e2e`. always() runs it whatever the parts did (expressions, "Status check
  # functions"), so a failed, cancelled or skipped part turns it red: without always() it would be skipped, and a
  # skipped required check reads as passing. needs.<job_id>.result is success, failure, cancelled or skipped
  # (contexts reference); anything but success fails, as in images.yml's scan gate. download-artifact v8.0.2 puts
  # each matched artifact in a folder named after it under path when merge-multiple is false, its default
  # (action.yml and README.md at that tag). assert-tests-ran then wants exactly one report per project.
  e2e:
    needs: [browser, a11y]
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Require every browser job and a11y to have succeeded
        env:
          BROWSER_RESULT: ${{ needs.browser.result }}
          A11Y_RESULT: ${{ needs.a11y.result }}
        run: |
          if [ "$BROWSER_RESULT" != success ] || [ "$A11Y_RESULT" != success ]; then
            echo "browser=$BROWSER_RESULT a11y=$A11Y_RESULT"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: e2e-*
          path: ${{ runner.temp }}/e2e
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Every discovered spec ran in some browser, each browser exactly once
        env:
          REPORTS: ${{ runner.temp }}/e2e
        run: >-
          node scripts/test/assert-tests-ran.ts
          "chromium=$REPORTS/e2e-chromium/tests/e2e/report.json"
          "firefox=$REPORTS/e2e-firefox/tests/e2e/report.json"
          "webkit=$REPORTS/e2e-webkit/tests/e2e/report.json"
