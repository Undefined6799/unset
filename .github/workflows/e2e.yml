# Accessibility and browser harness (P1.26). Drafts run nothing; marking the PR ready runs it.
# pa11y-ci 5.0.0 and @lhci/cli 0.15.1 are installed here, not in the lockfile: their trees fail
# npm audit --audit-level=high. Lighthouse upload is filesystem only (lighthouserc.json).
# Browser download is each job's own; a blocked download fails it.
#
# P0.07b: the suite runs as parallel jobs, one per Playwright project and one for pa11y and Lighthouse, so the
# critical path is the slowest part rather than their sum. Each job starts its own servers on its own runner, so each
# keeps its own rate-limit bucket and the one worker tests/e2e/playwright.config.ts asks for. `--project` and
# `install [browser...]` are from the CLI help of the pinned Playwright 1.64.0 (npx playwright test --help, npx
# playwright install --help). The e2e job is the gate: it needs every part and runs assert-tests-ran over all three
# reports, so a spec no browser ran, or a browser job that ran nothing, still fails.

name: e2e

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions: {}

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  browser:
    name: browser ${{ matrix.project }}
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    # fail-fast off, so one browser does not hide another (workflow-syntax, jobs.<job_id>.strategy.fail-fast).
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit]
    env:
      PROJECT: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps "$PROJECT"
      - name: Build the web app
        run: npm run build -w @unset/apps-web
      - name: Run Playwright
        run: |
          node tests/e2e/fixtures/servers.ts prod > e2e-prod.log 2>&1 &
          prod_pid=$!
          node tests/e2e/fixtures/servers.ts test > e2e-test.log 2>&1 &
          test_pid=$!
          cleanup() {
            kill "$prod_pid" "$test_pid" || true
          }
          trap cleanup EXIT
          node tests/e2e/fixtures/servers.ts wait
          npx playwright test --config tests/e2e/playwright.config.ts --project "$PROJECT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: e2e-${{ matrix.project }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            tests/e2e/report.json
            playwright-report/
            e2e-prod.log
            e2e-test.log

  a11y:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Build the web app
        run: npm run build -w @unset/apps-web
      - name: Install pa11y and Lighthouse outside the lockfile
        run: npm install --ignore-scripts --prefix /tmp/a11y-tools pa11y-ci@5.0.0 @lhci/cli@0.15.1
      - name: Point pa11y and Lighthouse at Playwright's Chromium
        run: node tests/e2e/fixtures/chrome-path.ts
      - name: Run pa11y and Lighthouse
        run: |
          export PATH="/tmp/a11y-tools/node_modules/.bin:$PATH"
          node tests/e2e/fixtures/servers.ts prod > e2e-prod.log 2>&1 &
          prod_pid=$!
          node tests/e2e/fixtures/servers.ts test > e2e-test.log 2>&1 &
          test_pid=$!
          cleanup() {
            kill "$prod_pid" "$test_pid" || true
          }
          trap cleanup EXIT
          node tests/e2e/fixtures/servers.ts wait
          pa11y-ci --config .pa11yci.json > pa11y-results.json
          lhci autorun --config ./lighthouserc.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: e2e-a11y
          retention-days: 14
          if-no-files-found: warn
          path: |
            .lighthouseci/
            pa11y-results.json
            e2e-prod.log
            e2e-test.log

  # A custom if without a status function still requires success() of every need (expressions, "Status check
  # functions"), so this gate runs only when all three browsers and a11y passed, and a skipped or failed part leaves it
  # unsuccessful. download-artifact v8.0.2 puts each matched artifact in a folder named after it under path when
  # merge-multiple is false, its default (action.yml and README.md at that tag).
  e2e:
    needs: [browser, a11y]
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: e2e-*
          path: ${{ runner.temp }}/e2e
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Every discovered spec ran in some browser, and every browser ran tests
        env:
          REPORTS: ${{ runner.temp }}/e2e
        run: >-
          node scripts/test/assert-tests-ran.ts
          "$REPORTS/e2e-chromium/tests/e2e/report.json"
          "$REPORTS/e2e-firefox/tests/e2e/report.json"
          "$REPORTS/e2e-webkit/tests/e2e/report.json"
