# P2.24d spike only; this branch is never merged. Runs on pushes to the spike branch.
name: p224d-spike
on:
  push:
    branches: [claude/p224d-font-spike]
permissions:
  contents: read
jobs:
  fonts:
    name: fonts ${{ matrix.project }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit]
    env:
      PROJECT: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - run: npx playwright install --with-deps "$PROJECT"
      - run: bash spike/p224d/up.sh
      - run: npx playwright test --config spike/p224d/playwright.config.ts --project "$PROJECT"
      - if: always()
        run: |
          cat "$RUNNER_TEMP"/p224d/upstream-*.txt || true
          docker logs edge 2>&1 | tail -50 || true
          docker logs pds 2>&1 | tail -50 || true
