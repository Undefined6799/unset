# CI gate for every ready pull request and every push to main (P0.07). A draft runs nothing here: it is checked
# locally with `npm run check`, and marking it ready (ready_for_review) runs the full set (Alex 2026-10-05 20:34Z).
#
# Secrets and OIDC rule (enforced by scripts/guards/workflow-pins.test.ts):
# - No repository-level secrets, ever. A secret lives in a GitHub Environment whose deployment
#   branches are limited to main and whose required reviewer is Alex.
# - `id-token: write` and any `secrets.<NAME>` other than secrets.GITHUB_TOKEN appear only in a job
#   that declares that `environment:` and has
#   `if: github.event_name == 'push' && github.ref == 'refs/heads/main'`.
# - Any OIDC trust policy (cosign keyless, a cloud role) pins ref:refs/heads/main and the environment.
# - pull_request_target is banned. workflow_run is banned except docs-auto-merge.yml,
#   which checks out the default branch only and never runs pull request code (P0.07e).
# - Every action is GitHub-owned and pinned by commit SHA; every tool image by index digest.
# - No `${{ }}` expression inside a run: value; values reach scripts through env: only.

name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # P0.07d: the code checks and the image tests (*.image.test.ts, which build images) run as two parallel jobs.
  # `check`, the required name, is the gate that needs both (at the end of this file).
  code:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      # The notes guard's code-moved rule diffs BASE_SHA...HEAD; a missing base fails it (P0.09d).
      BASE_SHA: ${{ github.event.before }}
      RENOVATE_IMAGE: renovate/renovate:44.176.2@sha256:1ffc71775d95bd2233bf5a867744c5a92d845b5928dee93f5bb22ced956e4e38
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # adr_immutable compares ADRs with origin/main.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - name: Compare a pull request with the base it was merged onto
        if: github.event_name == 'pull_request'
        run: echo "BASE_SHA=$(git rev-parse HEAD^1)" >> "$GITHUB_ENV"
      - run: npm run guards
      # Every listed test file outside the images project; image-tests runs the rest (scripts/test/run.ts).
      - run: npm test -- --units
      - run: npm run budgets
      # P1.23r: the island gates read the production build, so CI builds the web app first.
      - name: Build the web app
        run: npm run build -w @unset/apps-web
      - name: Check the island JS budget
        run: node scripts/budgets/island.ts apps/web/dist/client
      - name: Report the island runtime's glue lines (warns above ADR 0015)
        run: >-
          node scripts/budgets/count-glue-lines.ts apps/web/src/islands/runtime --config apps/web/vite.config.ts
          --warn-above docs/human/evidence/0015-web-framework-glue/hono/MEASUREMENTS.json
      - name: Validate .github/renovate.json
        run: >-
          docker run --rm -v "$PWD:/repo" -w /repo --entrypoint renovate-config-validator "$RENOVATE_IMAGE"
          --strict --no-global .github/renovate.json

  audit:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # npm audit --audit-level=high, minus the expiring entries in .github/npm-audit-ignore.yaml (P0.07i).
      - run: node scripts/ci/npm-audit.ts
      # The @unset scope override applies only to this signature-key fetch: npm prefetches keys for every
      # registry any edge uses, workspace edges included, but never verifies or downloads a workspace. .npmrc
      # stays fail-closed for every install, and the dependency guard (scripts/guards/dependencies.ts) keeps every
      # @unset/* lockfile entry a plain workspace link. No other job may pass it (audit_override_only_in_audit_job).
      - run: npm audit signatures --@unset:registry=https://registry.npmjs.org/

  secrets:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
      # P0.07a: a pull request is judged on its own commits; the SHAs reach the script through env only.
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Fails closed before the scan: gitleaks v8.30.1 (sources/git.go) carries on past a git log error, so a missing
      # commit or an empty range would otherwise read as a clean scan.
      - name: Scan this pull request's commits
        if: github.event_name == 'pull_request'
        run: |
          git rev-parse --verify --quiet "$BASE_SHA^{commit}" > /dev/null
          git rev-parse --verify --quiet "$HEAD_SHA^{commit}" > /dev/null
          test "$(git rev-list --count "$BASE_SHA..$HEAD_SHA")" -gt 0
          docker run --rm -v "$PWD:/repo" -w /repo "$GITLEAKS_IMAGE" git --redact --no-banner --config .github/.gitleaks.toml --log-opts="$BASE_SHA..$HEAD_SHA" .
      # Every other event (push to main) scans every ref's full history: a secret pushed to any branch is exposed and
      # must be rotated, but it no longer turns unrelated pull requests red (ruling 2026-10-06).
      - name: Scan full history
        if: github.event_name != 'pull_request'
        run: docker run --rm -v "$PWD:/repo" -w /repo "$GITLEAKS_IMAGE" git --redact --no-banner --config .github/.gitleaks.toml .
      - name: Scan working tree
        run: docker run --rm -v "$PWD:/repo" -w /repo "$GITLEAKS_IMAGE" dir --redact --no-banner --config .github/.gitleaks.toml .
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # The scope and the one public-key exception, proven on fixtures built at run time (scripts/ci/secrets-fixtures.ts).
      - name: Prove the scan on planted fixtures
        run: node scripts/ci/secrets-fixtures.ts

  actionlint:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      ACTIONLINT_IMAGE: rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker run --rm -v "$PWD:/repo" -w /repo "$ACTIONLINT_IMAGE" -color

  semgrep:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      SEMGREP_IMAGE: semgrep/semgrep:1.182.0@sha256:4a34048c04fef049f71665047f074cffb00cc3d89482f965a5cd151d589237af
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Semgrep CE
        run: >-
          docker run --rm -v "$PWD:/src" -w /src "$SEMGREP_IMAGE"
          semgrep scan --config scripts/lint/semgrep/ --config p/typescript --config p/nodejs --config p/owasp-top-ten
          --metrics=off --error --sarif-output=semgrep.sarif
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: always()
        with:
          node-version-file: .nvmrc
      - name: Fail if no rules ran
        if: always()
        run: node scripts/ci/semgrep-rules-ran.ts semgrep.sarif
      # P1.01s: each custom rule fires on its must-fail fixtures and stays silent on its must-pass ones.
      # The script copies the rules (paths blocks stripped) and fixtures to a temp dir, scans that copy with
      # $SEMGREP_IMAGE --json and fails closed on a missing report, zero fixtures or any mismatch.
      - name: Prove custom rules on fixtures
        if: always()
        run: node scripts/lint/semgrep-fixtures.ts run
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: semgrep-sarif
          path: semgrep.sarif
          if-no-files-found: error

  sbom:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: npm sbom --package-lock-only --sbom-format cyclonedx > "sbom-$SHA.cdx.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom-*.cdx.json
          if-no-files-found: error

  # P0.09: build the Hugo docs site. No deploy. The image user is uid 1000
  # (gohugoio/hugo v0.168.0 Dockerfile, USER hugo) and a GitHub-hosted runner
  # is uid 1001, so the project directory has to be writable before hugo can
  # create public/ and resources/. Output is world-readable (umask 0022).
  docs-site:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      HUGO_IMAGE: ghcr.io/gohugoio/hugo:v0.168.0@sha256:1fb8fe7f417abd5802d86747d297728aa48078d763159e7dff6559fe3f8bb8e7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Let the Hugo user write the build
        run: chmod a+rwx docs/site
      - name: Build the docs site
        run: >-
          docker run --rm --entrypoint hugo -v "$PWD:/project" -w /project/docs/site "$HUGO_IMAGE"
          build --gc --minify --panicOnWarning
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-site
          path: docs/site/public/
          if-no-files-found: error

  duplicates:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Duplicate code (advice for the reviewer, never a gate)
        run: |
          npx jscpd --config .github/.jscpd.json .
          cat jscpd-report/jscpd-report.md >> "$GITHUB_STEP_SUMMARY" || true

  # P0.07d: the images project, beside code. `npm run test:images` is scripts/test/run.ts --images: CI's rules (no
  # skips, every image test file ran, at least one) and a Docker check. The checkout matches code's.
  image-tests:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    # P1.27t: the images build on the BuildKit that publish-images.yml builds on, the same pinned image, so a mode or
    # layout only that builder produces fails here first (staging's Postgres, 2026-10-23: --chmod also reached the
    # folder COPY created, which the runner's own builder did not do). scripts/ci/check-job.test.ts keeps the two equal.
    env:
      BUILDKIT_IMAGE: moby/buildkit:v0.34.1@sha256:99368f3e46177c6405b9740e4461d91cee004128daeecca78d4ceac50ec1da5c
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # default-load puts each build in the engine's image store, where the tests run it, as the docker driver does
      # (docs.docker.com/build/builders/drivers/docker-container, driver options `image` and `default-load`).
      - name: Create the BuildKit builder
        run: docker buildx create --use --name images --driver docker-container --driver-opt "image=$BUILDKIT_IMAGE" --driver-opt default-load=true
      - run: npm run test:images

  # The required name (.github/required-checks.json). always() runs it whatever code and image-tests did
  # (expressions, "Status check functions"): without it a failed need would skip this job, and a skipped required
  # check reads as passing. needs.<job_id>.result is success, failure, cancelled or skipped (contexts reference);
  # anything but success fails, as in images.yml's scan gate.
  check:
    needs: [code, image-tests]
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Require code and image-tests to have succeeded
        env:
          CODE_RESULT: ${{ needs.code.result }}
          IMAGES_RESULT: ${{ needs.image-tests.result }}
        run: |
          if [ "$CODE_RESULT" != success ] || [ "$IMAGES_RESULT" != success ]; then
            echo "code=$CODE_RESULT image-tests=$IMAGES_RESULT"
            exit 1
          fi
