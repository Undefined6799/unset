# Fetch Sigstore's public-good trusted root for review (P1.27s; ADR 0033, Decision 4). Run by hand only. cosign v3.1.3,
# pinned by its release checksum, is the TUF client: `cosign initialize` walks the public-good TUF repository from the
# root embedded in the binary and caches the signed targets, trusted_root.json among them, under
# ~/.sigstore/root/tuf-repo-cdn.sigstore.dev (sigstore-go's TUF cache layout; unverified until the first run, since
# the sandbox that wrote this could not reach the TUF CDN). The job uploads trusted_root.json as a run artifact and
# prints the TUF root version and the file's sha256 in the job summary. It reads only, holds no secret and no
# environment, and never commits, pushes or opens a PR: placing the file is P2.26e, a reviewed PR.

name: sigstore-root

on:
  workflow_dispatch:

permissions: {}

jobs:
  fetch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      COSIGN_VERSION: v3.1.3
      COSIGN_SHA256: 4629c757b7618056f8ddd7e2625ae9fdd94c0372a65049520bc7d9df9efc7f71
    steps:
      - name: Install cosign by checksum
        run: |
          curl -sSfL -o "$RUNNER_TEMP/cosign" \
            "https://github.com/sigstore/cosign/releases/download/$COSIGN_VERSION/cosign-linux-amd64"
          echo "$COSIGN_SHA256  $RUNNER_TEMP/cosign" | sha256sum -c -
          install -m 0755 "$RUNNER_TEMP/cosign" /usr/local/bin/cosign
      - name: Fetch the trusted root through TUF
        run: |
          cosign initialize
          cache="$HOME/.sigstore/root/tuf-repo-cdn.sigstore.dev"
          mkdir -p "$RUNNER_TEMP/out"
          cp "$cache/targets/trusted_root.json" "$RUNNER_TEMP/out/trusted_root.json"
          {
            echo "TUF root version: $(jq -r '.signed.version' "$cache/root.json")"
            echo "trusted_root.json sha256: $(sha256sum "$RUNNER_TEMP/out/trusted_root.json" | cut -d' ' -f1)"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trusted-root
          path: ${{ runner.temp }}/out/trusted_root.json
          if-no-files-found: error
