# Accepted Trivy findings (P1.27q). Format: Trivy v0.74.0 docs/guide/configuration/filtering.md (.trivyignore.yaml).
# Every entry needs `id`, a `statement` saying why it is accepted, and `expired_at` (yyyy-mm-dd) at most 90 days
