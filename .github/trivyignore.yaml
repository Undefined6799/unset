# Accepted Trivy findings (P1.27q). Format: Trivy v0.74.0 docs/guide/configuration/filtering.md (.trivyignore.yaml).
# Every entry needs `id`, a `statement` saying why it is accepted, and `expired_at` (yyyy-mm-dd) at most 90 days
# ahead; scripts/ci/trivyignore.test.ts fails on anything else, and on an entry once it has expired.
#
# vulnerabilities:
#   - id: CVE-0000-00000
#     statement: why the finding cannot reach us, and what removes it
#     expired_at: yyyy-mm-dd
vulnerabilities:
  - id: CVE-2026-102276
    paths:
      - "usr/local/lib/node_modules/npm/node_modules/brace-expansion/package.json"
    statement: >-
      brace-expansion 5.0.9, fixed in 5.0.10. npm bundled in the upstream Node base (node 26.10.0, npm 11.19.1),
      found by the mirror scan of the raw base; the web runtime strips npm (deployment/images/images.test.ts
      runtime_has_no_package_manager), so it never ships. Scoped to npm's own copy. Remove when upstream Node
      bundles the fixed version. Alex, 2026-10-07 02:02:20Z, "Ignore 14 days".
    expired_at: 2026-10-21
